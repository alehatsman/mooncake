---
name: Security

env:
  GO_VERSION: '1.26.3'

on:
  push:
    branches: [ "master", "main" ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches: [ "**" ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
  schedule:
    # Run weekly on Monday at midnight UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  gosec:
    name: Security Scan (gosec)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        # -no-fail: report findings as SARIF but exit 0 (findings surface via
        #          code-scanning when enabled; gosec output is also in logs).
        # Exclusions: G104/G204/G301/G306 (handled-elsewhere or convention),
        #             G115/G117 (integer-overflow false positives at boundaries),
        #             G302 (file perms — config/lockfile use 0644 by design),
        #             G304 (path-from-variable — every config-reading codepath),
        #             G702/G703/G704 (legacy noise).
        run: gosec -no-fail -exclude-generated -exclude=G104,G115,G117,G204,G301,G302,G304,G306,G702,G703,G704 -fmt sarif -out gosec.sarif ./...

      - name: Upload SARIF file
        # continue-on-error: code scanning requires GitHub Advanced Security on
        # private repos. Don't fail the workflow when upload is rejected; the
        # SARIF file is still generated and available locally.
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: gosec.sarif

  govulncheck:
    name: Vulnerability Scan (govulncheck)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    # Only run on pull requests
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
