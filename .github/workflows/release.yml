---
name: release

on:
  push:
    tags:
      - 'v*'

env:
  GO_VERSION: '1.26.3'

permissions:
  contents: write
  attestations: write
  id-token: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Syft (for SBOM generation)
        uses: anchore/sbom-action/download-syft@v0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate latest.json
        run: |
          VERSION="${{ github.ref_name }}"
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          REPO="alehatsman/mooncake"
          BASE_URL="https://github.com/$REPO/releases/download/$VERSION"
          cat > latest.json << EOF
          {
            "version": "$VERSION",
            "date": "$DATE",
            "repository": "https://github.com/$REPO",
            "install": "curl -sSL https://raw.githubusercontent.com/$REPO/master/install.sh | sh",
            "checksums_url": "$BASE_URL/checksums.txt",
            "assets": {
              "linux/amd64": "$BASE_URL/mooncake_Linux_x86_64.tar.gz",
              "linux/arm64": "$BASE_URL/mooncake_Linux_arm64.tar.gz",
              "darwin/amd64": "$BASE_URL/mooncake_Darwin_x86_64.tar.gz",
              "darwin/arm64": "$BASE_URL/mooncake_Darwin_arm64.tar.gz",
              "windows/amd64": "$BASE_URL/mooncake_Windows_x86_64.zip"
            }
          }
          EOF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload latest.json to release
        run: gh release upload "${{ github.ref_name }}" latest.json --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*.tar.gz,dist/*.zip,dist/checksums.txt'
