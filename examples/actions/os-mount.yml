# os.mount — declarative /etc/fstab entry + live mount management.
#
# Identity is `dest` (mount point). The action ensures both the fstab
# entry and the current mount state match the declared shape; on
# Linux only. /etc/fstab is snapshotted to /etc/fstab.bak.<ts> before
# every change unless `backup: false`.

- name: mount data volume
  os.mount:
    src: /dev/sdb1
    dest: /data
    fstype: ext4
    options: [defaults, noatime]
    state: mounted

- name: register tmpfs entry but don't mount yet
  os.mount:
    src: tmpfs
    dest: /var/cache/build
    fstype: tmpfs
    options: [defaults, size=4G]
    state: fstab_only

- name: unmount swap volume but keep fstab entry
  os.mount:
    src: /dev/sdc1
    dest: /mnt/swap
    fstype: swap
    state: unmounted

- name: drop legacy mount entirely
  os.mount:
    dest: /mnt/legacy
    state: absent
