# Advanced example - Multi-file configuration
- vars:
    project_name: MyProject
    env: development

- name: Load environment variables
  vars.load: ./vars/{{env}}.yml
- name: Setup common configuration
  import: ./tasks/common.yml
- name: Setup OS-specific configuration
  import: ./tasks/macos.yml
  when: os == "darwin"

- name: Setup OS-specific configuration
  import: ./tasks/linux.yml
  when: os == "linux"

- name: Setup development tools
  import: ./tasks/dev-tools.yml
  when: env == "development"
  tags:
  - dev
