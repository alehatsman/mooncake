# All-or-nothing transactions via `transaction:` (spec-30, full).
#
# Three file.write children commit together or revert together. Run
# this example twice:
#
#   1. As-is — all three writes succeed; files exist at the end.
#   2. With a deliberate failure (see rollback-demo.yml) — the
#      previously-applied steps' Reverse() runs in LIFO order,
#      leaving the filesystem byte-identical to its pre-transaction
#      state.
#
# Spec-30 PR A shipped the parser + plan-time reversibility check.
# PR B shipped the executor state machine: success commit, LIFO
# rollback on failure, on_rollback firing.

version: "1.0"

steps:
  - name: provision three demo files atomically
    transaction:
      - name: create a
        file.write:
          path: /tmp/mc-txn-demo-a
          content: alpha

      - name: create b
        file.write:
          path: /tmp/mc-txn-demo-b
          content: beta

      - name: create c
        file.write:
          path: /tmp/mc-txn-demo-c
          content: gamma
