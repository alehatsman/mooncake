# Inline secrets via `!secret <provider>:<path>` (spec-23 §3).
#
# A YAML scalar tagged `!secret` is resolved at apply time and the
# resolved value is added to the run's redaction denylist — so it
# never appears in step.stdout, run logs, plan JSON, or fleet event
# streams. The built-in `env:` provider reads from the controller's
# process environment.
#
# Usage:
#
#   $ export APP_TOKEN='hunter2-very-secret'
#   $ mooncake apply --config examples/secrets/env-secret.yml
#
# Plan output (mooncake plan --format json) shows `"!secret env:APP_TOKEN"`
# rather than the resolved value, so it's safe to share or commit.

version: "1.0"

steps:
  - name: write app token to disk
    file.write:
      path: /tmp/mooncake-secret-demo.token
      content: !secret env:APP_TOKEN
      mode: "0600"

  - name: read back via shell — value must be redacted in output
    shell: cat /tmp/mooncake-secret-demo.token

  # Demonstrates that secrets work inside vars too — useful when the
  # same secret needs to flow into multiple downstream steps.
  - name: pass secret as env var to a shell command
    shell: env | grep APP_TOKEN || true
    env:
      APP_TOKEN: !secret env:APP_TOKEN
