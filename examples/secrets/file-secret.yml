# File-backed secrets via `!secret file:<path>` (spec-23 §3, tier-2
# `file:` provider).
#
# Useful when the secret is too large or sensitive for an env var
# (TLS keys, service-account JSON blobs), or when running under a
# secret-mounting system that materializes files (Kubernetes
# Secret-volume mounts at /run/secrets/, vault-agent sidecar
# templates, age-encrypted blobs decrypted to a tmpfs path, etc.).
#
# Convention: one trailing newline is stripped from the file's
# contents (matches how `kubectl create secret` writes them), but
# internal whitespace is preserved — multi-line PEM keys come back
# intact.
#
# Usage:
#
#   $ echo -n "hunter2-from-disk" > /tmp/mooncake-file-secret-demo.token
#   $ chmod 600                    /tmp/mooncake-file-secret-demo.token
#   $ mooncake apply --config examples/secrets/file-secret.yml
#
# Plan output (`mooncake plan --format json`) shows
# `"!secret file:/tmp/..."` literally — never the contents.

version: "1.0"

steps:
  - name: write the file-backed token to a target file
    file.write:
      path: /tmp/mooncake-file-secret-output.token
      content: !secret file:/tmp/mooncake-file-secret-demo.token
      mode: "0600"

  - name: read back via shell — value must be redacted in step output
    shell: cat /tmp/mooncake-file-secret-output.token

  # Demonstrates ~/ home expansion (file: handles a leading ~ for the
  # operator's HOME directory). Commented out so the example doesn't
  # require seeding ~/.config/mooncake-demo/.
  # - name: home-relative secret
  #   file.write:
  #     path: /tmp/mooncake-home-secret.token
  #     content: !secret file:~/.config/mooncake-demo/token
