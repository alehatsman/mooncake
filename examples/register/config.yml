# Example showing how to capture and use command output with register

# Check if a command exists
- name: Check if git is installed
  shell: which git
  as: git_check
- name: Show git location
  shell: echo "Git found at {{ git_check.stdout }}"
  when: git_check.rc == 0

- name: Git not found
  shell: echo "Git is not installed"
  when: git_check.rc != 0

# Get current user
- name: Get current username
  shell: whoami
  as: current_user
- name: Create user-specific config
  file.write:
    path: "/tmp/{{ current_user.stdout }}_config.txt"
    state: file
    content: |
      User: {{ current_user.stdout }}
      Config created by Mooncake
    mode: "0644"

# Check OS version
- name: Get OS version
  shell: uname -r
  as: os_version
- name: Display OS version
  shell: echo "Running kernel version {{ os_version.stdout }}"

# Example with file operations
- name: Create test file
  file.write:
    path: /tmp/test-register.txt
    state: file
    content: "Test content"
  as: file_result
- name: Show if file was created
  shell: echo "File operation changed={{ file_result.changed }}"

- name: Print summary
  log:
    msg: |
      Register example complete!
      This example showed how to:
      - Capture command output with 'register'
      - Use captured output in conditions with 'when'
      - Access stdout, stderr, rc (return code)
      - Use register with file operations
