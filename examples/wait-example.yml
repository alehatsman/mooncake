# wait.* Action Examples
# Demonstrates polling primitives for agent / service synchronization.
#
# Usage:
#   mooncake run --config examples/wait-example.yml

####################
# 1. wait.file
####################

- name: Wait for ready marker file
  wait.file:
    path: /tmp/ready.txt
    timeout: 2m
    poll_interval: 1s
  tags: [file]

- name: Wait for build artifact
  wait.file:
    path: ./dist/mooncake
    timeout: 10m
    poll_interval: 5s
  tags: [file, build]

- name: Wait for file to contain marker text
  wait.file:
    path: /var/log/myapp.log
    contains: "server ready"
    timeout: 1m
  tags: [file]

####################
# 2. wait.port
####################

- name: Wait for database port
  wait.port:
    host: localhost
    port: 5432
    timeout: 60s
    poll_interval: 2s
  tags: [port, database]

- name: Wait for Redis
  wait.port:
    host: redis
    port: 6379
    timeout: 30s
  tags: [port, redis]

####################
# 3. wait.http
####################

- name: Wait for API to be healthy
  wait.http:
    url: http://localhost:8080/health
    status: [200]
    timeout: 2m
    poll_interval: 5s
  tags: [http]

- name: Wait for deployment status with body check
  wait.http:
    url: https://api.example.com/status
    status: [200, 204]
    body_contains: "ready"
    headers:
      Authorization: "Bearer {{ api_token }}"
    timeout: 10m
    poll_interval: 30s
  tags: [http, deployment]

####################
# 4. wait.command
####################

- name: Wait for postgres to accept queries
  wait.command:
    cmd: "pg_isready -U postgres"
    expect_exit: 0
    timeout: 60s
  tags: [command, database]

- name: Wait for kubectl rollout
  wait.command:
    cmd: kubectl rollout status deployment/myapp
    timeout: 5m
    poll_interval: 10s
  tags: [command, k8s]

####################
# 5. PRACTICAL USE CASES
####################

# Service dependency chain
- name: Start database
  os.service:
    name: postgresql
    state: started
  as_user: root
  tags: [services]

- name: Wait for database to accept connections
  wait.port:
    host: localhost
    port: 5432
    timeout: 60s
  tags: [services]

- name: Run database migrations
  shell: ./migrate.sh
  tags: [services]

- name: Wait for application health check
  wait.http:
    url: http://localhost:8080/health
    status: [200]
    timeout: 2m
  tags: [services]

####################
# 6. RESULT REGISTRATION
####################

- name: Wait and capture result
  wait.port:
    host: localhost
    port: 5432
    timeout: 60s
  as: db_wait
  tags: [register]

- name: Show wait results
  log:
    msg: |
      Wait succeeded: {{ db_wait.success }}
      Elapsed: {{ db_wait.elapsed_ms }}ms
      Iterations: {{ db_wait.iterations }}
  tags: [register]
