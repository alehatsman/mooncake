# mooncake CI — runs the full `mooncake task ci` gate on every push.
#
# This is the ONLY place the full gate runs. Both git hooks (pre-commit and
# pre-push) run `mooncake task ci-fast`, so a green push says nothing about the
# 11 stages below — check the run.
#
# Schema (moongit internal/ci/ci.go): version "1"; `on.push.branches` gates
# which refs trigger a run; `jobs` is a DAG wired by `needs`. Each job runs in a
# throwaway container off `image:`, and moongitd execs every step as
# `mooncake step '<yaml>'` inside it — so the image MUST carry `mooncake` + git
# on PATH (plus whatever the steps shell out to). See ci/Dockerfile for the
# image this job uses (mooncake-ci:latest = moongit-ci-dev + gomarkdoc).
#
# `mooncake task ci` is the 11-step gate:
# build + cross-build + test + lint + vuln + docs/schema regen-and-verify +
# mkdocs + arch-snapshot + budget + dupl + escalation-lint. Its go tooling
# (golangci-lint/govulncheck/gocyclo/dupl) comes from the shared go-quality
# module, fetched from github.com over https (see tasks.yml). The job therefore
# needs no host trust and no route back to the moongit host — a throwaway
# container with an empty module cache resolves it on its own. It did not
# always: the module used to be pinned at this moongit over plain http, which
# worked only while the image happened to carry a warm cache (#192).
#
# Branch coverage: enumerated rather than "*" so a push does not silently cost a
# full 11-stage container run on refs nobody meant to gate. The list is the set
# of conventional prefixes this repo actually uses (`git log --all` branch
# survey) — extend it when a new one appears. It used to be [main, "feat/*"],
# which left `fix/*` — the single most-used prefix here — with no CI at all, so
# a fix could only be exercised server-side by merging it to main, i.e. after
# the gate that was supposed to check it (#195).
version: "1"
on:
  push:
    branches:
      - main
      - "feat/*"
      - "fix/*"
      - "refactor/*"
      - "chore/*"
      - "docs/*"
      - "perf/*"
      - "test/*"
      - "specs/*"
      - "dx/*"
jobs:
  quality:
    image: mooncake-ci:latest
    steps:
      - shell:
          # Two-stage on purpose. The `mooncake` on the container's PATH is the
          # static one baked into mooncake-ci:latest, so it lags this repo by
          # however long it has been since the image was rebuilt — it cannot run
          # CLI surface added after that. Build first with whatever the image
          # has, then run the gate with the binary from the commit under test.
          # Without this, adding --keep-going below failed the whole run at
          # step 1 with "flag provided but not defined" (run 113).
          #
          # --keep-going so one standing failure does not hide the stages behind
          # it. The run still fails; it fails with the whole picture. Without it
          # the vuln stage (5/11) had been masking 6-11 for as long as #187 has
          # been open — including the docs/schema regen-and-verify (#193).
          cmd: mooncake task build && out/mooncake task ci --keep-going
