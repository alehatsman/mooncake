version: "2"

run:
  timeout: 5m
  tests: false

linters:
  # Pragmatic stance: enable bug-catching linters, disable style-pedantry
  # ones. The dropped linters (gocritic / unparam / dupl / prealloc) flag
  # legitimate design choices (interface contracts that always return nil
  # err, parallel-by-design sibling commands, intentional monolithic
  # functions) as problems. The soft-cap discipline in CLAUDE.md covers
  # complexity ratchet without needing cyclop noise on every PR.
  enable:
    - gosec
    - errcheck
    - staticcheck
    - govet
    - ineffassign
    - unused
    - misspell
    - unconvert
    - bodyclose
    - revive
    - cyclop
  disable:
    - errname
    - exhaustive
    - wrapcheck
    - goconst
    - gocyclo     # superseded by cyclop (single cyclomatic source); arch-snapshot uses gocyclo standalone for the soft-cap ratchet
    - gocritic    # mostly style; the project's review process handles ifElseChain / typeSwitchVar etc.
    - unparam     # flags interface contracts that always return nil err as "problems"; not actionable
    - dupl        # over-eager on parallel-by-design siblings (fleet exec/observe share output rendering on purpose)
    - prealloc    # micro-optimisation noise; profile-driven not lint-driven

  settings:
    gosec:
      severity: "medium"
      confidence: "medium"
      # Single source of truth for gosec excludes — Makefile and any CI
      # invocations should run gosec via golangci-lint, not standalone.
      excludes:
        - G104  # errors unhandled
        - G115  # integer overflow conversion
        - G117  # exported struct field matches secret pattern
        - G204  # subprocess launched with variable
        - G301  # bad dir perms
        - G302  # file perms — config/lockfile use 0644 by design
        - G304  # path from variable — every config-reading codepath
        - G306  # bad write perms
        - G702  # command injection via taint analysis
        - G703  # path traversal via taint analysis
        - G704  # SSRF via taint analysis

    gocritic:
      enabled-checks:
        - appendCombine
        - boolExprSimplify
        - dupImport
        - nilValReturn
        - weakCond
      disabled-checks:
        - ifElseChain

    cyclop:
      # Aligned with the CLAUDE.md soft cap (35). Anything above 35 is a
      # refactor target; the arch-snapshot ratchet drives those down over
      # time. Below 35, functions pass lint regardless.
      max-complexity: 35

    dupl:
      threshold: 200

    errcheck:
      check-type-assertions: true
      check-blank: false

    goconst:
      min-len: 3
      min-occurrences: 6

    revive:
      enable-all-rules: false
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        # redefines-builtin-id removed: `max`/`min`/`clear` were added to
        # Go 1.21 builtins, but local variables of those names are fine
        # and legal — the warning produces noise on otherwise clean code.

    staticcheck:
      # Keep SA* (the real-bug checks); drop QF/ST/S style suggestions.
      # ST1020 (comment prefix), ST1005 (error-string format), S1008
      # (boolean ternary), S1017 (TrimPrefix), QF1007 (merge conditional),
      # QF1012 (use Fprintf) are all style preferences, not bugs.
      checks: ["all", "-QF*", "-ST1005", "-ST1020", "-S1008", "-S1017", "-S1034"]

  exclusions:
    rules:
      - path: internal/(executor/shell_step|llm/claude_cli_client|actions/service/handler)\.go
        linters: [gosec]
        text: "G204"

      - path: internal/utils/
        linters: [revive]
        text: "var-naming: avoid meaningless package names"

      # Action subpackages use snake_case to mirror their action-type names
      # (file_replace, os_user, text_patch_json, …). Includes
      # internal/actions/package/ which is named package_handler because
      # `package` is a Go reserved word.
      - path: internal/actions/
        linters: [revive, staticcheck]
        text: "(var-naming: don't use an underscore in package name|ST1003: should not use underscores in package names|ST1000:)"

      - path: internal/utils/checksum\.go
        linters: [dupl]
        text: "lines are duplicate"

      # file_patch_apply has the same patch-loading idiom in run.go and
      # handler.go (Spec-16 dual-path). Helper extraction not worth the
      # indirection.
      - path: internal/actions/file_patch_apply/
        linters: [dupl]

      - path: internal/(agent|actions/artifact_capture|actions/artifact_validate)/
        linters: [gosec]
        text: "G(301|306)"

      - path: internal/(actions/artifact_capture|artifacts)/
        linters: [goconst]

      - path: internal/(actions/template|template)/
        linters: [revive]
        text: "var-naming: avoid package names that conflict with Go standard library"

      - path: cmd/mooncake\.go
        linters: [errcheck]
        text: "Error return value of `app.Run` is not checked"

      # fmt.Fprintf/Fprintln/Fprint to w/os.Stdout/os.Stderr in cmd/ and
      # internal display helpers — these are best-effort writes to terminal
      # output; ignoring the error is idiomatic Go CLI code.
      - path: cmd/
        linters: [errcheck]
        text: "Error return value of `fmt\\.F"

      # fmt.Fprintf/Fprintln to operator-facing writers in internal/fleet/
      # and a few other display helpers — best-effort writes to terminal
      # output; ignoring the error is idiomatic Go CLI code.
      - path: internal/(doctor/render_text|fleet/.+|logger/first_run_subscriber|pilot/confirm|scaffold/scaffold)\.go
        linters: [errcheck]
        text: "Error return value of `fmt\\.F"

      # resp.Body.Close and io.Copy in cmd/runs.go — standard streaming
      # pattern; defer/best-effort close errors are intentionally unchecked.
      - path: cmd/runs\.go
        linters: [errcheck]
        text: "Error return value of `(resp\\.Body\\.Close|io\\.Copy)` is not checked"

      # scaffold.go cleanup calls — best-effort removes inside deferred error paths.
      - path: internal/scaffold/scaffold\.go
        linters: [errcheck]
        text: "Error return value of `(tmp\\.Close|os\\.Remove)` is not checked"

      # internal/fleet/transport/agentd.go response body close.
      - path: internal/fleet/transport/agentd\.go
        linters: [errcheck]

      # cyclop: complex but intentionally monolithic CLI/planning functions.
      # These are tracked in the soft-cap budget; refactor on next touch.
      - path: cmd/fleet\.go
        linters: [cyclop]

      - path: cmd/mooncake\.go
        linters: [cyclop]

      - path: internal/actions/os_systemd/handler\.go
        linters: [cyclop]

      # copy.Execute and executor.ExecuteStep are intentionally
      # monolithic dispatch functions. Tracked in the soft-cap budget;
      # refactor on next touch per CLAUDE.md.
      - path: internal/actions/copy/handler\.go
        linters: [cyclop]

      - path: internal/executor/executor\.go
        linters: [cyclop]

      - path: internal/explain/explain\.go
        linters: [cyclop]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
