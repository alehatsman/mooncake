- name: Check if rbenv is installed
  shell: command -v rbenv
  as: rbenv_check
  failed_when: false

- name: Install rbenv (macOS)
  pkg:
    name: rbenv
    state: present
  when: brew_available

- name: Install rbenv (Debian/Ubuntu)
  pkg:
    name: rbenv
    state: present
  as_user: root
  when: apt_available

- name: Install rbenv (RHEL/Fedora)
  pkg:
    name: rbenv
    state: present
  as_user: root
  when: (dnf_available | default(false)) or (yum_available | default(false))

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v rbenv
      exit_code: 0

- name: Display confirmation
  log: "rbenv installed"
