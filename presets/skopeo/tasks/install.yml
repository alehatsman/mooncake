- name: Check if skopeo is installed
  shell: command -v skopeo
  as: skopeo_check
  failed_when: false

- name: Install skopeo (macOS)
  pkg:
    name: skopeo
    state: present
  when: brew_available and skopeo_check.rc != 0

- name: Install skopeo (Linux)
  pkg:
    name: skopeo
    state: present
  as_user: root
  when: apt_available and skopeo_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v skopeo
      exit_code: 0

- name: Display confirmation
  log: "skopeo installed"
