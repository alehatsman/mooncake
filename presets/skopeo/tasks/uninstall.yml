- name: Uninstall skopeo (macOS)
  pkg:
    name: skopeo
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall skopeo (Linux)
  pkg:
    name: skopeo
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v skopeo
      exit_code: 1

- name: Display confirmation
  log: "skopeo uninstalled"
