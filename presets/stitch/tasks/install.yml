- name: Check if stitch is installed
  shell: command -v stitch
  as: stitch_check
  failed_when: false

- name: Install stitch
  pkg:
    name: stitch
    state: present
  when: stitch_check.rc != 0

- name: Verify installation
  shell: stitch --version 2>&1 || stitch -v 2>&1 || echo "installed"
  as: stitch_version
- name: Display version
  log: "stitch installed"
