- name: Uninstall sops (macOS)
  pkg:
    name: sops
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall sops (Linux)
  pkg:
    name: sops
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v sops
      exit_code: 1

- name: Display confirmation
  log: "sops uninstalled"
