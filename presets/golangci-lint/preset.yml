name: golangci-lint
description: Fast linters runner for Go with parallel execution and caching
version: 1.0.0
parameters: {state: {type: string, required: false, default: present, enum: [present, absent]}}
steps:
  - {name: Install, import: tasks/install.yml, when: 'parameters.state == "present"'}
  - {name: Uninstall, import: tasks/uninstall.yml, when: 'parameters.state == "absent"'}
