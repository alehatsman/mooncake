- name: Check if code is installed
  shell: command -v code
  as: vscode_check
  failed_when: false

- name: Install vscode
  pkg:
    name: vscode
    state: present
  when: vscode_check.rc != 0

- name: Verify installation
  shell: code --version 2>&1 || code -v 2>&1 || echo "installed"
  as: vscode_version
- name: Display version
  log: "vscode installed"
