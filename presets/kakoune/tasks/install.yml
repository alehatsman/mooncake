- name: Check if kak is installed
  shell: command -v kak
  as: kakoune_check
  failed_when: false

- name: Install kakoune (macOS)
  pkg:
    name: kakoune
    state: present
  when: brew_available and kakoune_check.rc != 0

- name: Install kakoune (Linux)
  pkg:
    name: kakoune
    state: present
  as_user: root
  when: apt_available and kakoune_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v kak
      exit_code: 0

- name: Display confirmation
  log: "kakoune installed"
