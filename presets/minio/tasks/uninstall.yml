# MinIO Uninstallation Tasks

- name: Stop MinIO service (Linux)
  os.service:
    name: minio
    state: stopped
  as_user: root
  failed_when: false
  when: linux

- name: Disable MinIO service (Linux)
  os.service:
    name: minio
    enabled: false
  as_user: root
  failed_when: false
  when: linux

- name: Remove MinIO systemd service (Linux)
  file.write:
    path: /etc/systemd/system/minio.service
    state: absent
  as_user: root
  when: linux

- name: Reload systemd daemon (Linux)
  shell: systemctl daemon-reload
  as_user: root
  when: linux

- name: Stop MinIO server (macOS)
  shell: pkill -f "minio server"
  failed_when: false
  when: brew_available

# macOS Uninstallation
- name: Uninstall MinIO via Homebrew (macOS)
  pkg:
    name: minio/stable/minio
    state: absent
  when: brew_available

# Linux Uninstallation
- name: Remove MinIO binaries (Linux)
  file.write:
    path: "{{ item }}"
    state: absent
  as_user: root
  loop:
  - /usr/local/bin/minio
  - /usr/local/bin/mc
  when: linux

- name: Clean up log file
  file.write:
    path: /tmp/minio.log
    state: absent
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v minio
      exit_code: 1

- name: Display uninstall confirmation
  log: "MinIO has been uninstalled (data in {{ parameters.data_dir }} remains)"
