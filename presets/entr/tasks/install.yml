- name: Check if entr is installed
  shell: command -v entr
  as: entr_check
  failed_when: false

- name: Install entr
  pkg:
    name: entr
    state: present
  when: entr_check.rc != 0

- name: Verify installation
  shell: entr --version 2>&1 || entr -v 2>&1 || echo "installed"
  as: entr_version
- name: Display version
  log: "entr installed"
- name: Verify installation with assert
  assert:
    command:
      cmd: command -v entr
      exit_code: 0
