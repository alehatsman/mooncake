- name: Uninstall restic (macOS)
  pkg:
    name: restic
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall restic (Linux)
  pkg:
    name: restic
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v restic
      exit_code: 1

- name: Display confirmation
  log: "restic uninstalled"
