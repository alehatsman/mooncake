- name: Uninstall nushell (macOS)
  pkg:
    name: nushell
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall nushell (Linux)
  pkg:
    name: nushell
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v nu
      exit_code: 1

- name: Display confirmation
  log: "nushell uninstalled"
