# Kubernetes Tools Uninstallation

- name: Uninstall kubectl (macOS)
  pkg:
    name: kubectl
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall kubectl (Linux)
  file.write:
    path: /usr/local/bin/kubectl
    state: absent
  as_user: root
  when: linux
  failed_when: false

- name: Uninstall k9s (macOS)
  pkg:
    name: k9s
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall k9s (Linux)
  file.write:
    path: /usr/local/bin/k9s
    state: absent
  as_user: root
  when: linux
  failed_when: false

- name: Uninstall Helm (macOS)
  pkg:
    name: helm
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall Helm (Linux)
  file.write:
    path: /usr/local/bin/helm
    state: absent
  as_user: root
  when: linux
  failed_when: false

- name: Uninstall kubectx (macOS)
  pkg:
    name: kubectx
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall kubectx (Linux)
  file.write:
    path: /opt/kubectx
    state: absent
  as_user: root
  when: linux
  failed_when: false

- name: Remove kubectx symlink (Linux)
  file.write:
    path: /usr/local/bin/kubectx
    state: absent
  as_user: root
  when: linux
  failed_when: false

- name: Remove kubens symlink (Linux)
  file.write:
    path: /usr/local/bin/kubens
    state: absent
  as_user: root
  when: linux
  failed_when: false

- name: Remove krew directory
  file.write:
    path: ~/.krew
    state: absent
  failed_when: false

- name: Remove kubectl config directory
  file.write:
    path: ~/.kube
    state: absent
  failed_when: false

- name: Assert kubectl is removed
  assert:
    command:
      cmd: command -v kubectl
      exit_code: 1

- name: Assert k9s is removed
  assert:
    command:
      cmd: command -v k9s
      exit_code: 1

- name: Assert helm is removed
  assert:
    command:
      cmd: command -v helm
      exit_code: 1

- name: Display confirmation
  log: "Kubernetes tools uninstalled"
