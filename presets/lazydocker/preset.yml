name: lazydocker
description: Install lazydocker - terminal UI for Docker and Docker Compose
version: "1.0.0"

parameters:
  state:
    type: string
    required: false
    default: present
    enum: [present, absent]
    description: Whether to install or uninstall lazydocker

steps:
  - name: Install lazydocker
    import: tasks/install.yml
    when: parameters.state == "present"

  - name: Uninstall lazydocker
    import: tasks/uninstall.yml
    when: parameters.state == "absent"
