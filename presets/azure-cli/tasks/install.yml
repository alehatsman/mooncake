- name: Check if az is installed
  shell: command -v az
  as: az_check
  failed_when: false

- name: Install azure-cli via Homebrew
  pkg:
    name: azure-cli
    state: present
  when: brew_available and az_check.rc != 0

- name: Install azure-cli via apt
  pkg:
    name: azure-cli
    state: present
  as_user: root
  when: apt_available and az_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v az
      exit_code: 0

- name: Display confirmation
  log: "azure-cli installed"
