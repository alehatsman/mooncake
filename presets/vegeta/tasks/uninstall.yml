- name: Uninstall vegeta (macOS)
  pkg:
    name: vegeta
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall vegeta (Linux)
  file.write:
    path: /usr/local/bin/vegeta
    state: absent
  as_user: root
  when: linux
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v vegeta
      exit_code: 1

- name: Display confirmation
  log: "vegeta uninstalled"
