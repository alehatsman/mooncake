- name: Uninstall autojump via Homebrew
  pkg:
    name: autojump
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall autojump via apt
  pkg:
    name: autojump
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v autojump
      exit_code: 1

- name: Display confirmation
  log: "autojump uninstalled"
