- name: Check if tmate is installed
  shell: command -v tmate
  as: tmate_check
  failed_when: false

- name: Install tmate (macOS)
  pkg:
    name: tmate
    state: present
  when: brew_available and tmate_check.rc != 0

- name: Install tmate (Linux)
  pkg:
    name: tmate
    state: present
  as_user: root
  when: apt_available and tmate_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v tmate
      exit_code: 0

- name: Display confirmation
  log: "tmate installed"
