- name: Check if tyk is installed
  shell: command -v tyk
  as: tyk_check
  failed_when: false

- name: Install tyk
  pkg:
    name: tyk
    state: present
  when: tyk_check.rc != 0

- name: Verify installation
  shell: tyk --version 2>&1 || tyk -v 2>&1 || echo "installed"
  as: tyk_version
- name: Display version
  log: "tyk installed"
