- name: Check if temporal is installed
  shell: command -v temporal
  as: temporal_check
  failed_when: false

- name: Install temporal
  pkg:
    name: temporal
    state: present
  when: temporal_check.rc != 0

- name: Verify installation
  shell: temporal --version 2>&1 || temporal -v 2>&1 || echo "installed"
  as: temporal_version
- name: Display version
  log: "temporal installed"
