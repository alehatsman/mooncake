- name: Check if bookkeeper is installed
  shell: command -v bookkeeper
  as: bookkeeper_check
  failed_when: false

- name: Install bookkeeper
  pkg:
    name: bookkeeper
    state: present
  when: bookkeeper_check.rc != 0

- name: Verify installation
  shell: bookkeeper --version 2>&1 || bookkeeper -v 2>&1 || echo "installed"
  as: bookkeeper_version
- name: Display version
  log: "bookkeeper installed"
