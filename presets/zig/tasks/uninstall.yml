- name: Uninstall zig via Homebrew
  pkg:
    name: zig
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall zig via apt
  pkg:
    name: zig
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v zig
      exit_code: 1

- name: Display confirmation
  log: "zig uninstalled"
