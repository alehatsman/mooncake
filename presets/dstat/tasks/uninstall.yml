- name: Uninstall dstat via apt
  pkg:
    name: dstat
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v dstat
      exit_code: 1
  when: linux

- name: Display confirmation
  log: "dstat uninstalled"
