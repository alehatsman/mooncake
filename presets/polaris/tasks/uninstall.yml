- name: Uninstall polaris (macOS)
  pkg:
    name: polaris
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall polaris (Linux)
  file.write:
    path: /usr/local/bin/polaris
    state: absent
  when: linux
  as_user: root
- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v polaris
      exit_code: 1

- name: Display confirmation
  log: "polaris uninstalled"
