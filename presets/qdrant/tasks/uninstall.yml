- name: Uninstall qdrant (macOS)
  pkg:
    name: qdrant
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall qdrant (Linux)
  pkg:
    name: qdrant
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v qdrant
      exit_code: 1

- name: Display confirmation
  log: "qdrant uninstalled"
