- name: Check if httpie is installed
  shell: command -v http
  as: httpie_check
  failed_when: false

- name: Install httpie (macOS)
  pkg:
    name: httpie
    state: present
  when: brew_available and httpie_check.rc != 0

- name: Install httpie (Linux)
  pkg:
    name: httpie
    state: present
  as_user: root
  when: apt_available and httpie_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v http
      exit_code: 0

- name: Display confirmation
  log: "httpie installed"
