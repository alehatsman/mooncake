- name: Uninstall httpie (macOS)
  pkg:
    name: httpie
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall httpie (Linux)
  pkg:
    name: httpie
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v http
      exit_code: 1

- name: Display confirmation
  log: "httpie uninstalled"
