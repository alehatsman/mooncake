- name: Uninstall terraform (macOS)
  pkg:
    name: terraform
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall terraform (Linux)
  pkg:
    name: terraform
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v terraform
      exit_code: 1

- name: Display confirmation
  log: "terraform uninstalled"
