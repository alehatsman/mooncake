- name: Check if make is installed
  shell: command -v make
  as: make_check
  failed_when: false

- name: Install make (macOS)
  pkg:
    name: make
    state: present
  when: brew_available and make_check.rc != 0

- name: Install make (Linux)
  pkg:
    name: build-essential
    state: present
  as_user: root
  when: apt_available and make_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v make
      exit_code: 0

- name: Display confirmation
  log: "make installed"
