- name: Uninstall make (macOS)
  pkg:
    name: make
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall make (Linux)
  pkg:
    name: build-essential
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v make
      exit_code: 1

- name: Display confirmation
  log: "make uninstalled"
