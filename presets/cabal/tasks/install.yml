- name: Check if cabal is installed
  shell: command -v cabal
  as: cabal_check
  failed_when: false

- name: Install cabal
  pkg:
    name: cabal
    state: present
  when: cabal_check.rc != 0

- name: Verify installation
  shell: cabal --version 2>&1 || cabal -v 2>&1 || echo "installed"
  as: cabal_version
- name: Display version
  log: "cabal installed"
- name: Verify installation with assert
  assert:
    command:
      cmd: command -v cabal
      exit_code: 0
