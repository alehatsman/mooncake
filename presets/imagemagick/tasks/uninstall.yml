- name: Uninstall imagemagick (macOS)
  pkg:
    name: imagemagick
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall imagemagick (Linux)
  pkg:
    name: imagemagick
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v convert
      exit_code: 1

- name: Display confirmation
  log: "imagemagick uninstalled"
