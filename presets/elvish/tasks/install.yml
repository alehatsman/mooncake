- name: Check if elvish is installed
  shell: command -v elvish
  as: elvish_check
  failed_when: false

- name: Install elvish
  pkg:
    name: elvish
    state: present
  when: elvish_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v elvish
      exit_code: 0

- name: Display confirmation
  log: "elvish installed"
