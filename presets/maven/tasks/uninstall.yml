- name: Uninstall maven (macOS)
  pkg:
    name: maven
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall maven (Linux)
  pkg:
    name: maven
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v mvn
      exit_code: 1

- name: Display confirmation
  log: "maven uninstalled"
