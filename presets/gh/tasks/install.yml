- name: Check if gh is installed
  shell: command -v gh
  as: gh_check
  failed_when: false

- name: Install gh (macOS)
  pkg:
    name: gh
    state: present
  when: brew_available and gh_check.rc != 0

- name: Install gh (Linux)
  pkg:
    name: gh
    state: present
  as_user: root
  when: apt_available and gh_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v gh
      exit_code: 0

- name: Display confirmation
  log: "gh installed"
