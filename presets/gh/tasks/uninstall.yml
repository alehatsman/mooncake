- name: Uninstall gh (macOS)
  pkg:
    name: gh
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall gh (Linux)
  pkg:
    name: gh
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v gh
      exit_code: 1

- name: Display confirmation
  log: "gh uninstalled"
