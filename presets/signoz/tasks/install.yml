- name: Check if signoz is installed
  shell: command -v signoz
  as: signoz_check
  failed_when: false

- name: Install signoz
  pkg:
    name: signoz
    state: present
  when: signoz_check.rc != 0

- name: Verify installation
  shell: signoz --version 2>&1 || signoz -v 2>&1 || echo "installed"
  as: signoz_version
- name: Display version
  log: "signoz installed"
