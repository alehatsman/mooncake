- name: Uninstall socat (macOS)
  pkg:
    name: socat
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall socat (Linux)
  pkg:
    name: socat
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v socat
      exit_code: 1

- name: Display confirmation
  log: "socat uninstalled"
