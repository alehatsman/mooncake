- name: Check if dive is installed
  shell: command -v dive
  as: dive_check
  failed_when: false

- name: Install dive
  pkg:
    name: dive
    state: present
  when: dive_check.rc != 0

- name: Verify installation
  shell: dive --version 2>&1 || echo "installed"
  as: dive_version
- name: Display version
  log: "dive installed: {{ dive_version.stdout }}"
- name: Verify installation with assert
  assert:
    command:
      cmd: command -v dive
      exit_code: 0
