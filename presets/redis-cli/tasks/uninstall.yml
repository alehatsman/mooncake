- name: Uninstall redis-cli (macOS)
  pkg:
    name: redis
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall redis-cli (Linux)
  pkg:
    name: redis-tools
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v redis-cli
      exit_code: 1

- name: Display confirmation
  log: "redis-cli uninstalled"
