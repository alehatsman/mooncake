- name: Uninstall shellcheck (macOS)
  pkg:
    name: shellcheck
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall shellcheck (Linux)
  pkg:
    name: shellcheck
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v shellcheck
      exit_code: 1

- name: Display confirmation
  log: "shellcheck uninstalled"
