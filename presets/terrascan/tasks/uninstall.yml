- name: Uninstall terrascan (macOS)
  pkg:
    name: terrascan
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall terrascan (Linux)
  file.write:
    path: /usr/local/bin/terrascan
    state: absent
  as_user: root
  when: linux
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v terrascan
      exit_code: 1

- name: Display confirmation
  log: "terrascan uninstalled"
