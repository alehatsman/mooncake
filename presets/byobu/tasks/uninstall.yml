- name: Uninstall byobu via Homebrew
  pkg:
    name: byobu
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall byobu via apt
  pkg:
    name: byobu
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v byobu
      exit_code: 1

- name: Display confirmation
  log: "byobu uninstalled"
