# Grafana Uninstallation Tasks

- name: Stop Grafana service (Linux)
  os.service:
    name: grafana-server
    state: stopped
  as_user: root
  failed_when: false
  when: linux

- name: Stop Grafana service (macOS)
  shell: brew services stop grafana
  failed_when: false
  when: brew_available

# macOS Uninstallation
- name: Uninstall Grafana via Homebrew (macOS)
  pkg:
    name: grafana
    state: absent
  when: brew_available

# Linux Uninstallation
- name: Uninstall Grafana (Debian/Ubuntu)
  pkg:
    name: grafana
    state: absent
  as_user: root
  when: apt_available

- name: Uninstall Grafana (RHEL/Fedora)
  pkg:
    name: grafana
    state: absent
  as_user: root
  when: dnf_available or yum_available

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v grafana-server
      exit_code: 1

- name: Display uninstall confirmation
  log: "Grafana has been uninstalled (configuration and data in /var/lib/grafana may remain)"
