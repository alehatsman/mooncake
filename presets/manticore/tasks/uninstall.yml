- name: Uninstall manticore via Homebrew
  pkg:
    name: manticore
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall manticore via apt
  pkg:
    name: manticore
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v manticore
      exit_code: 1

- name: Display confirmation
  log: "manticore uninstalled"
