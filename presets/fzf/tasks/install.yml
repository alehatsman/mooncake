- name: Check if fzf is installed
  shell: command -v fzf
  as: fzf_check
  failed_when: false

- name: Install fzf
  pkg:
    name: fzf
    state: present
  as_user: root
  when: fzf_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v fzf
      exit_code: 0

- name: Display confirmation
  log: "fzf installed"
