- name: Check if rtx is installed
  shell: command -v rtx
  as: rtx_check
  failed_when: false

- name: Install rtx (macOS)
  pkg:
    name: rtx
    state: present
  when: brew_available and rtx_check.rc != 0

- name: Install rtx (Linux)
  pkg:
    name: rtx
    state: present
  as_user: root
  when: apt_available and rtx_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v rtx
      exit_code: 0

- name: Display confirmation
  log: "rtx installed"
