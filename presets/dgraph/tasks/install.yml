- name: Check if dgraph is installed
  shell: command -v dgraph
  as: dgraph_check
  failed_when: false

- name: Install dgraph
  pkg:
    name: dgraph
    state: present
  when: dgraph_check.rc != 0

- name: Verify installation
  shell: dgraph --version 2>&1 || dgraph -v 2>&1 || echo "installed"
  as: dgraph_version
- name: Display version
  log: "dgraph installed"
