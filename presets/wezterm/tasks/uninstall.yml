- name: Uninstall wezterm (macOS)
  pkg:
    name: wezterm
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall wezterm (Linux)
  pkg:
    name: wezterm
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v wezterm
      exit_code: 1

- name: Display confirmation
  log: "wezterm uninstalled"
