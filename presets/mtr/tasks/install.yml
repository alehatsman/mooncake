- name: Check if mtr is installed
  shell: command -v mtr
  as: mtr_check
  failed_when: false

- name: Install mtr (macOS)
  pkg:
    name: mtr
    state: present
  when: brew_available and mtr_check.rc != 0

- name: Install mtr (Linux)
  pkg:
    name: mtr
    state: present
  as_user: root
  when: apt_available and mtr_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v mtr
      exit_code: 0

- name: Display version
  log: "mtr installed"
