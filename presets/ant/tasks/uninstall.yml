- name: Uninstall ant (macOS)
  pkg:
    name: ant
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall ant (Linux)
  pkg:
    name: ant
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v ant
      exit_code: 1

- name: Display confirmation
  log: "ant uninstalled"
