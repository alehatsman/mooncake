- name: Check if cadence is installed
  shell: command -v cadence
  as: cadence_check
  failed_when: false

- name: Install cadence
  pkg:
    name: cadence
    state: present
  when: cadence_check.rc != 0

- name: Verify installation
  shell: cadence --version 2>&1 || cadence -v 2>&1 || echo "installed"
  as: cadence_version
- name: Display version
  log: "cadence installed"
