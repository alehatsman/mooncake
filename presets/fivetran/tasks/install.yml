- name: Check if fivetran is installed
  shell: command -v fivetran
  as: fivetran_check
  failed_when: false

- name: Install fivetran
  pkg:
    name: fivetran
    state: present
  when: fivetran_check.rc != 0

- name: Verify installation
  shell: fivetran --version 2>&1 || fivetran -v 2>&1 || echo "installed"
  as: fivetran_version
- name: Display version
  log: "fivetran installed"
