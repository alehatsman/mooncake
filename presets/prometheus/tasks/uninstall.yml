# Prometheus Uninstallation Tasks

- name: Stop Prometheus service (Linux)
  os.service:
    name: prometheus
    state: stopped
  as_user: root
  failed_when: false
  when: linux

- name: Stop Prometheus service (macOS)
  shell: brew services stop prometheus
  failed_when: false
  when: brew_available

# macOS Uninstallation
- name: Uninstall Prometheus via Homebrew (macOS)
  pkg:
    name: prometheus
    state: absent
  when: brew_available

# Linux Uninstallation
- name: Uninstall Prometheus (Debian/Ubuntu)
  pkg:
    name: prometheus
    state: absent
  as_user: root
  when: apt_available

- name: Uninstall Prometheus (Fedora/RHEL)
  pkg:
    name: prometheus
    state: absent
  as_user: root
  when: dnf_available

- name: Remove Prometheus binaries (Arch)
  file.write:
    path: "{{ item }}"
    state: absent
  as_user: root
  loop:
  - /usr/local/bin/prometheus
  - /usr/local/bin/promtool
  when: pacman_available

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v prometheus
      exit_code: 1

- name: Display uninstall confirmation
  log: "Prometheus has been uninstalled (data in {{ parameters.data_dir }} may remain)"
