- name: Uninstall powershell (macOS)
  pkg:
    name: powershell
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall powershell (Linux)
  pkg:
    name: powershell
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v pwsh
      exit_code: 1

- name: Display confirmation
  log: "powershell uninstalled"
