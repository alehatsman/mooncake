- name: Uninstall cmake via Homebrew
  pkg:
    name: cmake
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall cmake via apt
  pkg:
    name: cmake
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v cmake
      exit_code: 1

- name: Display confirmation
  log: "cmake uninstalled"
