- name: Uninstall rsync (macOS)
  pkg:
    name: rsync
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall rsync (Linux)
  pkg:
    name: rsync
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v rsync
      exit_code: 1

- name: Display confirmation
  log: "rsync uninstalled"
