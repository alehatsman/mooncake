- name: Check if rsync is installed
  shell: command -v rsync
  as: rsync_check
  failed_when: false

- name: Install rsync (macOS)
  pkg:
    name: rsync
    state: present
  when: brew_available and rsync_check.rc != 0

- name: Install rsync (Linux)
  pkg:
    name: rsync
    state: present
  as_user: root
  when: apt_available and rsync_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v rsync
      exit_code: 0

- name: Display confirmation
  log: "rsync installed"
