- name: Uninstall tflint (macOS)
  pkg:
    name: tflint
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall tflint (Linux)
  file.write:
    path: /usr/local/bin/tflint
    state: absent
  as_user: root
  when: linux
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v tflint
      exit_code: 1

- name: Display confirmation
  log: "tflint uninstalled"
