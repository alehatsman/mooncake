- name: Check if squid is installed
  shell: command -v squid
  as: squid_check
  failed_when: false

- name: Install squid
  pkg:
    name: squid
    state: present
  when: squid_check.rc != 0

- name: Verify installation
  shell: squid --version 2>&1 || squid -v 2>&1 || echo "installed"
  as: squid_version
- name: Display version
  log: "squid installed"
