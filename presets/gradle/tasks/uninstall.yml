- name: Uninstall gradle (macOS)
  pkg:
    name: gradle
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall gradle (Linux)
  pkg:
    name: gradle
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v gradle
      exit_code: 1

- name: Display confirmation
  log: "gradle uninstalled"
