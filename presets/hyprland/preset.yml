name: hyprland
description: Install Hyprland Wayland compositor with Waybar, Wofi, Dunst, Hyprpaper, Hyprlock, and Hypridle
version: 1.0.0

parameters:
  state:
    type: string
    required: false
    default: present
    enum: [present, absent]
    description: Whether Hyprland should be installed or removed

  terminal:
    type: string
    required: false
    default: alacritty
    description: Default terminal emulator

steps:
  - name: Install Hyprland
    include: tasks/install.yml
    when: parameters.state == "present"

  - name: Uninstall Hyprland
    include: tasks/uninstall.yml
    when: parameters.state == "absent"
