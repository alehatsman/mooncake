- name: Check if quickwit is installed
  shell: command -v quickwit
  as: quickwit_check
  failed_when: false

- name: Install quickwit (macOS)
  pkg:
    name: quickwit
    state: present
  when: brew_available and quickwit_check.rc != 0

- name: Install quickwit (Linux)
  pkg:
    name: quickwit
    state: present
  as_user: root
  when: apt_available and quickwit_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v quickwit
      exit_code: 0

- name: Display confirmation
  log: "quickwit installed"
