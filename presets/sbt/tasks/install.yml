- name: Check if sbt is installed
  shell: command -v sbt
  as: sbt_check
  failed_when: false

- name: Install sbt (macOS)
  pkg:
    name: sbt
    state: present
  when: brew_available and sbt_check.rc != 0

- name: Install sbt (Linux)
  pkg:
    name: sbt
    state: present
  as_user: root
  when: apt_available and sbt_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v sbt
      exit_code: 0

- name: Display confirmation
  log: "sbt installed"
