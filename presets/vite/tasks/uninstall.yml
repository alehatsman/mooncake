- name: Uninstall vite (macOS)
  pkg:
    name: vite
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall vite (Linux)
  shell: npm uninstall -g vite
  when: linux
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v vite
      exit_code: 1

- name: Display confirmation
  log: "vite uninstalled"
