- name: Uninstall werf (macOS)
  pkg:
    name: werf
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall werf (Linux)
  file.write:
    path: /usr/local/bin/werf
    state: absent
  as_user: root
  when: linux
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v werf
      exit_code: 1

- name: Display confirmation
  log: "werf uninstalled"
