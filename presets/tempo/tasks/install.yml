- name: Check if tempo is installed
  shell: command -v tempo
  as: tempo_check
  failed_when: false

- name: Install tempo
  pkg:
    name: tempo
    state: present
  when: tempo_check.rc != 0

- name: Verify installation
  shell: tempo --version 2>&1 || tempo -v 2>&1 || echo "installed"
  as: tempo_version
- name: Display version
  log: "tempo installed"
