- name: Uninstall neovim (macOS)
  pkg:
    name: neovim
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall neovim (Linux)
  pkg:
    name: neovim
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v nvim
      exit_code: 1

- name: Display confirmation
  log: "neovim uninstalled"
