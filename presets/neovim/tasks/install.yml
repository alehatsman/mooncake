- name: Check if neovim is installed
  shell: command -v nvim
  as: neovim_check
  failed_when: false

- name: Install neovim via Homebrew
  pkg:
    name: neovim
    state: present
  when: brew_available and neovim_check.rc != 0

- name: Install neovim via apt
  pkg:
    name: neovim
    state: present
  as_user: root
  when: apt_available and neovim_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v nvim
      exit_code: 0

- name: Display confirmation
  log: "neovim installed"
