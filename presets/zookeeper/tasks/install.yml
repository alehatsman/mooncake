- name: Check if zookeeper is installed
  shell: command -v zookeeper
  as: zookeeper_check
  failed_when: false

- name: Install zookeeper
  pkg:
    name: zookeeper
    state: present
  when: zookeeper_check.rc != 0

- name: Verify installation
  shell: zookeeper --version 2>&1 || zookeeper -v 2>&1 || echo "installed"
  as: zookeeper_version
- name: Display version
  log: "zookeeper installed"
