- name: Check if editorconfig is installed
  shell: command -v editorconfig
  as: editorconfig_check
  failed_when: false

- name: Install editorconfig
  pkg:
    name: editorconfig
    state: present
  when: editorconfig_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v editorconfig
      exit_code: 0

- name: Display confirmation
  log: "editorconfig installed"
