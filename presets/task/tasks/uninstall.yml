- name: Uninstall task via Homebrew
  pkg:
    name: task
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall task via apt
  pkg:
    name: task
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v task
      exit_code: 1

- name: Display confirmation
  log: "task uninstalled"
