# Docker Uninstallation Tasks

- name: Stop Docker service (Linux)
  os.service:
    name: docker
    state: stopped
    enabled: false
  as_user: root
  when: linux
  failed_when: false

- name: Uninstall Docker (macOS)
  pkg:
    name: docker
    state: absent
  as_user: root
  when: brew_available
  failed_when: false

- name: Uninstall Docker Engine (Debian/Ubuntu)
  pkg:
    names:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Uninstall Docker (RHEL/Fedora)
  pkg:
    names:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin
    state: absent
  as_user: root
  when: dnf_available
  failed_when: false

- name: Remove Docker data directory
  file.write:
    path: /var/lib/docker
    state: absent
  as_user: root
  when: linux
  failed_when: false

- name: Remove Docker configuration
  file.write:
    path: /etc/docker
    state: absent
  as_user: root
  when: linux
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v docker
      exit_code: 1

- name: Display confirmation
  log: "Docker uninstalled"
