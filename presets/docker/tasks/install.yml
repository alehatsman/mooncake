# Docker Installation Tasks

- name: Check if Docker is already installed
  shell: command -v docker
  as: docker_check
  failed_when: false

# macOS Installation
- name: Install Docker Desktop via Homebrew (macOS)
  pkg:
    name: docker
    state: present
  when: brew_available and docker_check.rc != 0

# Linux - Debian/Ubuntu
- name: Install Docker prerequisites (Debian/Ubuntu)
  pkg:
    names:
    - ca-certificates
    - curl
    - gnupg
    - lsb-release
    state: present
  as_user: root
  when: apt_available and docker_check.rc != 0

- name: Add Docker GPG key (Debian/Ubuntu)
  shell: |
    install -m 0755 -d /etc/apt/keyrings
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    chmod a+r /etc/apt/keyrings/docker.gpg
  as_user: root
  when: apt_available and docker_check.rc != 0

- name: Add Docker repository (Debian/Ubuntu)
  shell: |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  as_user: root
  when: apt_available and docker_check.rc != 0

- name: Update apt cache (Debian/Ubuntu)
  shell: apt-get update
  as_user: root
  when: apt_available and docker_check.rc != 0

- name: Install Docker Engine (Debian/Ubuntu)
  pkg:
    names:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin
    state: present
  as_user: root
  when: apt_available and docker_check.rc != 0

# Linux - RHEL/Fedora/CentOS
- name: Install Docker via DNF (RHEL/Fedora)
  pkg:
    names:
    - docker-ce
    - docker-ce-cli
    - containerd.io
    - docker-buildx-plugin
    - docker-compose-plugin
    state: present
  as_user: root
  when: dnf_available and docker_check.rc != 0

# Verify installation
- name: Verify installation with assert
  assert:
    command:
      cmd: command -v docker
      exit_code: 0

- name: Display confirmation
  log: "Docker installed"
