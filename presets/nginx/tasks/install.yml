# Nginx Installation Tasks

- name: Check if Nginx is already installed
  shell: command -v nginx
  as: nginx_check
  failed_when: false

# macOS Installation
- name: Install Nginx via Homebrew (macOS)
  pkg:
    name: nginx
    state: present
  when: (parameters.state == "present") and (os == "darwin") and (nginx_check.rc != 0)

# Linux - Debian/Ubuntu
- name: Install Nginx (Debian/Ubuntu)
  pkg:
    name: nginx
    state: present
  as_user: root
  when: (parameters.state == "present") and (os == "linux") and (nginx_check.rc != 0)

# Linux - RHEL/Fedora/CentOS
- name: Install Nginx (RHEL/Fedora/CentOS)
  pkg:
    name: nginx
    state: present
  as_user: root
  when: (parameters.state == "present") and (os == "linux") and (nginx_check.rc != 0)

# Linux - Arch
- name: Install Nginx (Arch)
  pkg:
    name: nginx
    state: present
  as_user: root
  when: (parameters.state == "present") and (os == "linux") and (nginx_check.rc != 0)

# Verify installation
- name: Verify Nginx installation
  shell: nginx -v
  as: nginx_version
- name: Display Nginx version
  log: "Nginx installed: {{ nginx_version.stderr }}"
- name: Verify installation
  assert:
    command:
      cmd: command -v nginx
      exit_code: 0
