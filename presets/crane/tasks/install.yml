- name: Check if crane is installed
  shell: command -v crane
  as: crane_check
  failed_when: false

- name: Install crane
  pkg:
    name: crane
    state: present
  when: crane_check.rc != 0

- name: Verify installation
  shell: crane --version 2>&1 || echo "installed"
  as: crane_version
- name: Display version
  log: "crane installed: {{ crane_version.stdout }}"
- name: Verify installation with assert
  assert:
    command:
      cmd: command -v crane
      exit_code: 0
