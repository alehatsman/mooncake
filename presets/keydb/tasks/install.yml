- name: Check if keydb is installed
  shell: command -v keydb
  as: keydb_check
  failed_when: false

- name: Install keydb
  pkg:
    name: keydb
    state: present
  when: keydb_check.rc != 0

- name: Verify installation
  shell: keydb --version 2>&1 || keydb -v 2>&1 || echo "installed"
  as: keydb_version
- name: Display version
  log: "keydb installed"
