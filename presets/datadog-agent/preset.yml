name: datadog-agent
description: Install Datadog Agent for infrastructure monitoring, metrics collection, and APM tracing
version: "1.0.0"
parameters:
  state:
    type: string
    required: false
    default: present
    enum: [present, absent]
steps:
  - name: Install datadog-agent
    import: tasks/install.yml
    when: parameters.state == "present"
  - name: Uninstall datadog-agent
    import: tasks/uninstall.yml
    when: parameters.state == "absent"
