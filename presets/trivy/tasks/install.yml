- name: Check if trivy is installed
  shell: command -v trivy
  as: trivy_check
  failed_when: false

- name: Install trivy (macOS)
  pkg:
    name: trivy
    state: present
  when: brew_available and trivy_check.rc != 0

- name: Install trivy (Linux)
  shell: |
    wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
    echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
    sudo apt-get update && sudo apt-get install -y trivy
  when: apt_available and trivy_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v trivy
      exit_code: 0

- name: Display confirmation
  log: "trivy installed"
