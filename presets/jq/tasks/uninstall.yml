- name: Uninstall jq (macOS)
  pkg:
    name: jq
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall jq (Linux)
  pkg:
    name: jq
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v jq
      exit_code: 1

- name: Display confirmation
  log: "jq uninstalled"
