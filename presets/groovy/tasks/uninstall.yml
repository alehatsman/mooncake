- name: Uninstall groovy (macOS)
  pkg:
    name: groovy
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall groovy (Linux)
  pkg:
    name: groovy
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v groovy
      exit_code: 1

- name: Display confirmation
  log: "groovy uninstalled"
