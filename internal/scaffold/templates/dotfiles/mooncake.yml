# Generated by `mooncake init --template dotfiles`
# Edit freely. Preview changes with `mooncake plan`. Apply with `mooncake apply`.
#
# Variables in mooncake.vars.yml are loaded automatically — no flag needed.
# Host facts like {{ os }}, {{ arch }}, {{ home }}, {{ package_manager }}
# resolve at apply time. Run `mooncake state facts` to see all of them.

- name: Ensure ~/.config exists
  file.write:
    path: "{{ home }}/.config"
    state: directory

- name: Print system summary
  log:
    msg: "mooncake managing {{ os }}/{{ arch }} on {{ distribution }}"
