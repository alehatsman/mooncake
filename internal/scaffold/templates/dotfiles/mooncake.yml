- name: Ensure ~/.config exists
  file.write:
    path: "{{ home }}/.config"
    state: directory

- name: Print system summary
  shell: echo "mooncake managing {{ os }}/{{ arch }} on {{ distribution }}"

- name: Suggest a starter component
  shell: |
    echo "Browse: ./presets/zsh/"
    echo "        ./presets/neovim/"
    echo "        ./presets/tmux/"
    echo "Then add a `use:` step to this playbook to include one."
