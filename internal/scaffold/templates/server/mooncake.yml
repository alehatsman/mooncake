# Generated by `mooncake init --template server`
# Edit freely. Preview changes with `mooncake plan`. Apply with `mooncake apply`.
#
# This scaffold uses `become: true` so you can wire up sudo immediately.
# Run with `-K` to be prompted for the sudo password:
#     mooncake apply -K

- name: Ensure /etc/mooncake.d/ exists
  file.write:
    path: /etc/mooncake.d
    state: directory
    mode: "0755"
  become: true

- name: Print server summary
  shell: echo "mooncake managing server {{ os }}/{{ arch }} ({{ distribution }})"

- name: Suggest a starter component
  shell: |
    echo "Browse: ./presets/docker/"
    echo "        ./presets/ufw/"
    echo "        ./presets/sshd-hardening/"
    echo "Then add a `use:` step to this playbook to include one."
