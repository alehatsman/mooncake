# Generated by `mooncake init --template server`
# Edit freely. Preview changes with `mooncake plan`. Apply with `mooncake apply`.
#
# This scaffold uses `as_user: root` so you can wire up sudo immediately.
# Run with `-K` to be prompted for the sudo password:
#     mooncake apply -K
#
# Variables in mooncake.vars.yml are loaded automatically — no flag needed.

- name: Ensure /etc/mooncake.d/ exists
  file.write:
    path: /etc/mooncake.d
    state: directory
    mode: "0755"
  as_user: root

- name: Print server summary
  log:
    msg: "mooncake managing server {{ os }}/{{ arch }} ({{ distribution }})"
