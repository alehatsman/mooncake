# Generated by `mooncake init --template agent-sandbox`
# Edit freely. Preview changes with `mooncake plan`. Apply with `mooncake apply`.
#
# This template demonstrates the typed-action surface AI agents should
# generate against. Prefer file.write / file.template / file.copy /
# file.download over `shell:` so every mutation is dry-runnable, diffable,
# and reversible.

- name: Ensure ~/.config exists
  file.write:
    path: "{{ home }}/.config"
    state: directory

- name: Drop a marker file (idempotent)
  file.write:
    path: "{{ home }}/.config/mooncake-agent.txt"
    state: file
    content: |
      Created by an agent via the mooncake typed-action surface.
      Re-running this playbook is safe: file state converges.
