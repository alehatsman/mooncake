version: '1'

# Mooncake's own task runner — the canonical entry point for developer
# workflows in this repo. Run with: `mooncake task <name>`.
# Bare `mooncake task` lists every task with its description.
#
# The generic Go quality gate (build/test/lint/vuln/scan/ai-lint/arch-snapshot/
# dupl + the fast/full CI cores) comes from the shared **go-quality** module
# (alehatsman/go-quality), so it stays in lockstep with dex + moongit. Each of
# those tasks is a thin wrapper over a `goq/*` component.
#
# Kept LOCAL because they're mooncake-unique (no module equivalent, or
# deliberately not generic): the docs-* (gomarkdoc/mkdocs) + schema-* pipeline,
# the project-specific budget-status (handler-LOC + Step-field caps on top of
# gocyclo/god-files), escalation-lint (spec-72), fmt (gofmt -s writer), install
# (mcake alias + agentd restart), test-race/test-cover, lint-new/lint-fix,
# install-tools/check-tools, agent-evals, release. The composite ci / ci-fast
# gates run the goq core and then mooncake's extra stages.
#
# PREREQ: go-quality is hosted on the local moongit over plain http, so the
# module fetch needs the host trusted once per shell:
#   export MOONCAKE_MODULE_INSECURE=host.docker.internal:8080
# (first run clones to ~/.cache/mooncake/modules/...; later runs hit cache.)
#
# The source uses host.docker.internal (not 127.0.0.1) so the SAME tasks.yml
# resolves from both the host — where host.docker.internal maps to this box —
# and inside a moongit CI container, where 127.0.0.1 would mean "the container
# itself" (see mgitci.yml; the runner adds --add-host host.docker.internal:
# host-gateway). Mirrors moongit + dex.
#
# Conventions:
#   - Tasks that need the built binary call `out/mooncake` directly.
#   - Non-trivial shell logic moves to scripts/. Keep this file at "what" level.

vars:
  BIN: out/mooncake

modules:
  goq: "host.docker.internal:8080/alehatsman/go-quality@v0.1.1"

tasks:

  # ── Build / install / clean ──────────────────────────────────────────
  build:
    desc: Build the mooncake binary into out/mooncake
    steps:
      - name: build
        use: goq/build
        props:
          cmd_path: ./cmd
          bin: '{{ BIN }}'

  # Kept local: mcake alias + PATH check + agentd restart are mooncake-specific.
  install:
    desc: Build and install mooncake to ~/.local/bin; create `mcake` alias; restart agentd if active
    steps:
      - shell: { cmd: "go build -v -o {{ BIN }} ./cmd" }
      - shell: { cmd: 'mkdir -p "$HOME/.local/bin" && install -m 0755 {{ BIN }} "$HOME/.local/bin/mooncake"' }
      - log: { msg: "installed $HOME/.local/bin/mooncake" }
      - shell:
          # `mcake` is the short alias. Symlink (not copy) so future
          # `mooncake task install` runs keep both entries in sync
          # automatically — the symlink resolves to whatever `mooncake`
          # currently is. `-f` overwrites a stale link; `-n` ensures we
          # don't accidentally follow into a directory of the same name.
          # Set MCAKE_ALIAS=0 to skip the symlink (rare; e.g. when the
          # name conflicts with a local tool you'd rather keep).
          cmd: |
            if [ "${MCAKE_ALIAS:-1}" != "0" ]; then
              ln -sfn mooncake "$HOME/.local/bin/mcake"
              echo "✓ aliased mcake → mooncake"
            fi
      - shell:
          cmd: |
            if ! echo ":$PATH:" | grep -q ":$HOME/.local/bin:"; then
              echo "⚠ $HOME/.local/bin is not on PATH — add it to your shell rc."
            fi
            if command -v systemctl >/dev/null 2>&1; then
              if systemctl --user is-active --quiet mooncake-agentd 2>/dev/null; then
                systemctl --user restart mooncake-agentd && echo "✓ Restarted mooncake-agentd (user)"
              fi
              if systemctl is-active --quiet mooncake-agentd 2>/dev/null; then
                sudo systemctl restart mooncake-agentd && echo "✓ Restarted mooncake-agentd (system)"
              fi
            fi

  clean:
    desc: Remove build artifacts (out/, testing-output/)
    steps:
      - shell: { cmd: "rm -rf out/ testing-output/" }
      - log: { msg: "cleaned" }

  # ── Test ─────────────────────────────────────────────────────────────
  # Pure single-use goq wrappers collapse to the `use:` shorthand; `mooncake
  # task` lists each go-quality component's own description (no drift).
  test: goq/test

  # Kept local: go-quality has no race component (race is a mooncake-local variant).
  test-race:
    desc: Run go test -race ./... (slower; not in default ci)
    steps:
      - shell: { cmd: "go test -race ./..." }

  # Kept local: coverage report is mooncake-specific.
  test-cover:
    desc: Run tests with HTML coverage report at testing-output/coverage.html
    steps:
      - shell: { cmd: "mkdir -p testing-output" }
      - shell: { cmd: "go test -coverprofile=testing-output/coverage.out -covermode=atomic ./..." }
      - shell: { cmd: "go tool cover -html=testing-output/coverage.out -o testing-output/coverage.html" }
      - log: { msg: "coverage report: testing-output/coverage.html" }

  # ── Lint / format ────────────────────────────────────────────────────
  lint: goq/lint

  # Kept local: --new-from-rev variant for refactor-friendly review.
  lint-new:
    desc: golangci-lint on lines changed since HEAD~1 (refactor-friendly)
    steps:
      - shell: { cmd: "golangci-lint run --new-from-rev=HEAD~1 ./..." }

  # Kept local: --fix variant (auto-fixer).
  lint-fix:
    desc: Auto-fix what golangci-lint can fix (misspell, unconvert, staticcheck QF/S, revive)
    steps:
      - shell: { cmd: "golangci-lint run --fix ./..." }

  # Kept local: this is the formatter (gofmt -s -w); goq/fmt is the check used
  # inside the ci-fast gate.
  fmt:
    desc: Format Go sources with gofmt -s
    steps:
      - shell: { cmd: "gofmt -s -w ." }
      - log: { msg: "code formatted" }

  # ── Security / vuln ──────────────────────────────────────────────────
  vuln: goq/vuln

  scan: goq/scan

  # ── Docs / schema ────────────────────────────────────────────────────
  # Kept local: fully mooncake-specific (gomarkdoc + the generated dist/docs
  # tree + MkDocs site + JSON/TS schema). Source of truth = code.

  docs-tools-install:
    desc: Install gomarkdoc + mkdocs python deps used by docs-generate / docs-build
    steps:
      - shell: { cmd: "go install github.com/princjef/gomarkdoc/cmd/gomarkdoc@v0.4.1" }
      - shell: { cmd: "pipenv install --dev" }
      - log: { msg: "installed gomarkdoc and pipenv-managed mkdocs deps" }

  docs-generate:
    desc: Regenerate the entire dist/docs/ tree from code
    steps:
      - shell: { cmd: "go build -o {{ BIN }} ./cmd" }
      - shell: { cmd: "rm -rf dist/docs && mkdir -p dist/docs" }
      - shell: { cmd: "{{ BIN }} docs generate --section all-into-dir --output dist/docs" }
      - log: { msg: "regenerated dist/docs/ from code" }

  docs-check:
    desc: Verify dist/docs/ is up to date with the current code
    steps:
      - shell: { cmd: "go build -o {{ BIN }} ./cmd" }
      - shell: { cmd: "BIN={{ BIN }} bash ./scripts/docs-check.sh" }

  docs-serve:
    desc: Serve the generated MkDocs site locally
    steps:
      - shell: { cmd: "pipenv run mkdocs serve" }

  docs-build:
    desc: Build the static MkDocs site into site/
    steps:
      - shell: { cmd: "pipenv run mkdocs build --strict" }

  docs-seed-readmes:
    desc: One-shot seed of stub READMEs under internal/actions/*/
    steps:
      - shell: { cmd: "bash ./scripts/seed-action-readmes.sh" }

  schema-generate:
    desc: Generate JSON Schema + TypeScript types from code
    steps:
      - shell: { cmd: "go build -o {{ BIN }} ./cmd" }
      - shell: { cmd: "{{ BIN }} schema generate --format json       --output internal/config/schema.json --strict" }
      - shell: { cmd: "{{ BIN }} schema generate --format typescript --output internal/config/schema.d" }
      - shell: { cmd: "{{ BIN }} schema generate --format typescript --output mooncake.d.ts" }
      - log: { msg: "generated internal/config/schema.json + schema.d + mooncake.d.ts" }

  schema-check:
    desc: Verify generated JSON schema is up to date
    steps:
      - shell: { cmd: "go build -o {{ BIN }} ./cmd" }
      - shell: { cmd: "BIN={{ BIN }} bash ./scripts/schema-check.sh" }

  # ── Architecture / analysis ──────────────────────────────────────────
  arch-snapshot: goq/arch-snapshot

  # Kept local: mooncake's budget adds project-specific caps (handler LOC,
  # config.Step universal-field count) on top of the generic gocyclo/god-files.
  budget-status:
    desc: Show current state of the three CLAUDE.md soft caps
    steps:
      - shell: { cmd: "bash ./scripts/budget-status.sh" }

  dupl: goq/dupl

  # ── AI-smell sweep / escalation lint ─────────────────────────────────
  ai-lint: goq/ai-lint

  ai-lint-all:
    desc: AI-smell sweep on every tracked Go file
    steps:
      - name: ai-lint-all
        use: goq/ai-lint
        props:
          args: "--all"

  # Kept local: spec-72 escalation lint is mooncake-specific.
  escalation-lint:
    desc: "spec-72 §G1: report direct security.BecomeRunner/PrivilegedRunner constructs outside the allowlist"
    steps:
      - shell: { cmd: "bash ./scripts/escalation-lint.sh" }

  # ── Tools ────────────────────────────────────────────────────────────
  # Kept local: mooncake keeps install-tools/check-tools separate (goq/tools
  # combines them); the scripts mirror the module's canonical set.
  install-tools:
    desc: Install every static-analysis tool the project depends on
    steps:
      - shell: { cmd: "bash ./scripts/install-tools.sh" }

  check-tools:
    desc: Report which static-analysis tools are installed
    steps:
      - shell: { cmd: "bash ./scripts/check-tools.sh" }

  # ── Agent evals (LLM-cost gated) ─────────────────────────────────────
  agent-evals:
    desc: Run mooncake agent evals (requires MOONCAKE_AGENT_EVAL=1; costs API tokens)
    steps:
      - shell:
          cmd: |
            if [ "$MOONCAKE_AGENT_EVAL" != "1" ]; then
              echo "mooncake task agent-evals: refusing to run — set MOONCAKE_AGENT_EVAL=1 to opt in." >&2
              echo "                           use 'mooncake task agent-evals-dry' for a no-cost shape check." >&2
              exit 2
            fi
            go run ./testing-next/agent-evals/

  agent-evals-dry:
    desc: Validate agent-eval harness without an LLM call
    steps:
      - shell: { cmd: "go run ./testing-next/agent-evals/ -dry-run" }

  # ── Release ──────────────────────────────────────────────────────────
  release:
    desc: Create a new release (runs scripts/release.sh)
    steps:
      - shell: { cmd: "bash ./scripts/release.sh" }

  # ── CI gates ─────────────────────────────────────────────────────────
  # Composite: the goq/* core (shared with dex + moongit) followed by
  # mooncake's unique stages. First failure stops the pipeline.

  ci-fast:
    desc: "Pre-commit gate: goq fast core (vet + gofmt + ai-lint + budget) + gated docs/schema regen"
    steps:
      - name: "goq fast core"
        use: goq/ci-fast
      - name: "docs/schema regen (gated)"
        shell: { cmd: "BIN={{ BIN }} bash ./scripts/docs-regen-staged.sh" }
      - log: { msg: "✓ Fast checks green — full 'mooncake task ci' gate runs on push." }

  ci:
    desc: "Pre-push gate: build + cross-build + test + lint + vuln + docs/schema + mkdocs + arch + budget + dupl + escalation-lint"
    steps:
      - name: "[1/11] build"
        use: goq/build
        props:
          cmd_path: ./cmd
          bin: '{{ BIN }}'
      - name: "[2/11] cross-build (GOOS-specific shims: windows/darwin)"
        shell:
          cmd: |
            for target in windows/amd64 darwin/amd64 darwin/arm64; do
              if ! GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
                go build -trimpath -o /dev/null ./cmd; then
                echo "  ✗ cross-build failed for ${target}" >&2
                exit 1
              fi
              echo "  ✓ ${target}"
            done
      - name: "[3/11] test"
        use: goq/test
      - name: "[4/11] lint"
        use: goq/lint
      - name: "[5/11] vuln"
        use: goq/vuln
      - name: "[6/11] regen docs + schema, then verify clean"
        shell:
          cmd: |
            rm -rf dist/docs && mkdir -p dist/docs
            {{ BIN }} docs generate --section all-into-dir --output dist/docs                           >/dev/null
            {{ BIN }} schema generate --format json       --output internal/config/schema.json --strict >/dev/null
            {{ BIN }} schema generate --format typescript --output internal/config/schema.d             >/dev/null
            {{ BIN }} schema generate --format typescript --output mooncake.d.ts                         >/dev/null
            BIN={{ BIN }} bash ./scripts/docs-check.sh
            BIN={{ BIN }} bash ./scripts/schema-check.sh
      - name: "[7/11] mkdocs build --strict (skipped when pipenv/mkdocs absent)"
        shell:
          cmd: |
            if command -v pipenv >/dev/null 2>&1 && pipenv run mkdocs --version >/dev/null 2>&1; then
              DISABLE_MKDOCS_2_WARNING=true pipenv run mkdocs build --strict --quiet
              echo "  ✓ mkdocs site built"
            else
              echo "  ⚠ pipenv/mkdocs not on PATH — skipping (run 'mooncake task docs-tools-install' to enable)"
            fi
      - name: "[8/11] arch-snapshot"
        use: goq/arch-snapshot
      - name: "[9/11] soft-cap budget (mooncake caps)"
        shell: { cmd: "bash ./scripts/budget-status.sh | sed 's/^/  /'" }
      - name: "[10/11] dupl (production-code duplication report)"
        use: goq/dupl
      - name: "[11/11] escalation-lint (spec-72 §G1)"
        shell: { cmd: "bash ./scripts/escalation-lint.sh --fail" }
      - log: { msg: "✓ All checks green — safe to push." }
