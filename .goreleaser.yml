version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: mooncake
    main: ./cmd
    binary: mooncake
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
      - "386"
    goarm:
      - "7"
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: 'checksums.txt'

sboms:
  - artifacts: archive
  - id: source
    artifacts: source

dockers:
  - image_templates:
      - "ghcr.io/alehatsman/mooncake:{{ .Tag }}-amd64"
      - "ghcr.io/alehatsman/mooncake:latest-amd64"
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
  - image_templates:
      - "ghcr.io/alehatsman/mooncake:{{ .Tag }}-arm64"
      - "ghcr.io/alehatsman/mooncake:latest-arm64"
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"

docker_manifests:
  - name_template: "ghcr.io/alehatsman/mooncake:{{ .Tag }}"
    image_templates:
      - "ghcr.io/alehatsman/mooncake:{{ .Tag }}-amd64"
      - "ghcr.io/alehatsman/mooncake:{{ .Tag }}-arm64"
  - name_template: "ghcr.io/alehatsman/mooncake:latest"
    image_templates:
      - "ghcr.io/alehatsman/mooncake:latest-amd64"
      - "ghcr.io/alehatsman/mooncake:latest-arm64"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - typo
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 'Bug fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999

release:
  github:
    owner: alehatsman
    name: mooncake
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## Mooncake {{ .Tag }} ({{ .Date }})

    Space fighters provisioning tool, **Chookity!**
  footer: |
    **Full Changelog**: https://github.com/alehatsman/mooncake/compare/{{ .PreviousTag }}...{{ .Tag }}

