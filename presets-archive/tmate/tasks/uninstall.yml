- name: Uninstall tmate (macOS)
  pkg:
    name: tmate
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall tmate (Linux)
  pkg:
    name: tmate
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v tmate
      exit_code: 1

- name: Display confirmation
  log: "tmate uninstalled"
