- name: Uninstall chruby via Homebrew
  pkg:
    name: chruby
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall chruby via apt
  pkg:
    name: chruby
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    file:
      path: /usr/local/share/chruby/chruby.sh
      exists: false

- name: Display confirmation
  log: "chruby uninstalled"
