- name: Check if tsx is installed
  shell: command -v tsx
  as: tsx_check
  failed_when: false

- name: Install tsx (macOS)
  pkg:
    name: tsx
    state: present
  when: brew_available and tsx_check.rc != 0

- name: Install tsx (Linux)
  shell: npm install -g tsx
  when: linux and tsx_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v tsx
      exit_code: 0

- name: Display confirmation
  log: "tsx installed"
