- name: Uninstall prometheus-server (macOS)
  pkg:
    name: prometheus
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall prometheus-server (Linux)
  pkg:
    name: prometheus
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v prometheus
      exit_code: 1

- name: Display confirmation
  log: "prometheus-server uninstalled"
