- name: Check if hx is installed
  shell: command -v hx
  as: helix_check
  failed_when: false

- name: Install helix (macOS)
  pkg:
    name: helix
    state: present
  when: brew_available and helix_check.rc != 0

- name: Install helix (Linux)
  pkg:
    name: helix
    state: present
  as_user: root
  when: apt_available and helix_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v hx
      exit_code: 0

- name: Display confirmation
  log: "helix installed"
