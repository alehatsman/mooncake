- name: Check if zig is installed
  shell: command -v zig
  as: zig_check
  failed_when: false

- name: Install zig via Homebrew
  pkg:
    name: zig
    state: present
  when: brew_available and zig_check.rc != 0

- name: Install zig via apt
  pkg:
    name: zig
    state: present
  as_user: root
  when: apt_available and zig_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v zig
      exit_code: 0

- name: Display version
  log: "zig installed"
