- name: Check if falco is installed
  shell: command -v falco
  as: falco_check
  failed_when: false

- name: Install falco
  pkg:
    name: falco
    state: present
  when: falco_check.rc != 0

- name: Verify installation
  shell: falco --version 2>&1 || falco -v 2>&1 || echo "installed"
  as: falco_version
- name: Display version
  log: "falco installed"
