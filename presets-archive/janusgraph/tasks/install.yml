- name: Check if janusgraph is installed
  shell: command -v janusgraph
  as: janusgraph_check
  failed_when: false

- name: Install janusgraph
  pkg:
    name: janusgraph
    state: present
  when: janusgraph_check.rc != 0

- name: Verify installation
  shell: janusgraph --version 2>&1 || janusgraph -v 2>&1 || echo "installed"
  as: janusgraph_version
- name: Display version
  log: "janusgraph installed"
