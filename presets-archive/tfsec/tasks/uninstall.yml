- name: Uninstall tfsec (macOS)
  pkg:
    name: tfsec
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall tfsec (Linux)
  file.write:
    path: /usr/local/bin/tfsec
    state: absent
  as_user: root
  when: os == "linux"
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v tfsec
      exit_code: 1

- name: Display confirmation
  log: "tfsec uninstalled"
