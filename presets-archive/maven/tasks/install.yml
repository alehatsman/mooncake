- name: Check if mvn is installed
  shell: command -v mvn
  as: maven_check
  failed_when: false

- name: Install maven (macOS)
  pkg:
    name: maven
    state: present
  when: brew_available and maven_check.rc != 0

- name: Install maven (Linux)
  pkg:
    name: maven
    state: present
  as_user: root
  when: apt_available and maven_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v mvn
      exit_code: 0

- name: Display confirmation
  log: "maven installed"
