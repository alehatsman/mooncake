name: signoz
description: Open-source observability platform
version: "1.0.0"
parameters:
  state:
    type: string
    required: false
    default: present
    enum: [present, absent]
steps:
  - name: Install signoz
    import: tasks/install.yml
    when: parameters.state == "present"
  - name: Uninstall signoz
    import: tasks/uninstall.yml
    when: parameters.state == "absent"
