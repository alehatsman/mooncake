- name: Check if scw is installed
  shell: command -v scw
  as: scaleway_cli_check
  failed_when: false

- name: Install scaleway-cli (macOS)
  pkg:
    name: scw
    state: present
  when: brew_available and scaleway_cli_check.rc != 0

- name: Install scaleway-cli (Linux)
  shell: curl -s https://raw.githubusercontent.com/scaleway/scaleway-cli/master/scripts/get.sh | sh
  when: linux and scaleway_cli_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v scw
      exit_code: 0

- name: Display confirmation
  log: "scaleway-cli installed"
