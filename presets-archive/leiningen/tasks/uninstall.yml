- name: Uninstall leiningen (macOS)
  pkg:
    name: leiningen
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall leiningen (Linux)
  pkg:
    name: leiningen
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v lein
      exit_code: 1

- name: Display confirmation
  log: "leiningen uninstalled"
