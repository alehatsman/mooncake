- name: Check if lein is installed
  shell: command -v lein
  as: leiningen_check
  failed_when: false

- name: Install leiningen via Homebrew
  pkg:
    name: leiningen
    state: present
  when: brew_available and leiningen_check.rc != 0

- name: Install leiningen (Linux)
  pkg:
    name: leiningen
    state: present
  as_user: root
  when: apt_available and leiningen_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v lein
      exit_code: 0

- name: Display confirmation
  log: "leiningen installed"
