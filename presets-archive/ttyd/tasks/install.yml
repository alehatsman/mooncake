- name: Check if ttyd is installed
  shell: command -v ttyd
  as: ttyd_check
  failed_when: false

- name: Install ttyd (macOS)
  pkg:
    name: ttyd
    state: present
  when: brew_available and ttyd_check.rc != 0

- name: Install ttyd (Linux)
  pkg:
    name: ttyd
    state: present
  as_user: root
  when: apt_available and ttyd_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v ttyd
      exit_code: 0

- name: Display confirmation
  log: "ttyd installed"
