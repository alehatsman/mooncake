- name: Uninstall ttyd (macOS)
  pkg:
    name: ttyd
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall ttyd (Linux)
  pkg:
    name: ttyd
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v ttyd
      exit_code: 1

- name: Display confirmation
  log: "ttyd uninstalled"
