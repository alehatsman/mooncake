- name: Uninstall pulsar (macOS)
  pkg:
    name: pulsar
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall pulsar (Linux)
  pkg:
    name: pulsar
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v pulsar
      exit_code: 1

- name: Display confirmation
  log: "pulsar uninstalled"
