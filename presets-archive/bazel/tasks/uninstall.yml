- name: Uninstall bazel via Homebrew
  pkg:
    name: bazel
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall bazel via apt
  pkg:
    name: bazel
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v bazel
      exit_code: 1

- name: Display confirmation
  log: "bazel uninstalled"
