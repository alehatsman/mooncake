- name: Check if envoy is installed
  shell: command -v envoy
  as: envoy_check
  failed_when: false

- name: Install envoy
  pkg:
    name: envoy
    state: present
  when: envoy_check.rc != 0

- name: Verify installation
  shell: envoy --version 2>&1 || envoy -v 2>&1 || echo "installed"
  as: envoy_version
- name: Display version
  log: "envoy installed"
