- name: Check if couchbase is installed
  shell: command -v couchbase
  as: couchbase_check
  failed_when: false

- name: Install couchbase
  pkg:
    name: couchbase
    state: present
  when: couchbase_check.rc != 0

- name: Verify installation
  shell: couchbase --version 2>&1 || couchbase -v 2>&1 || echo "installed"
  as: couchbase_version
- name: Display version
  log: "couchbase installed"
