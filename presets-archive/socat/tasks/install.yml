- name: Check if socat is installed
  shell: command -v socat
  as: socat_check
  failed_when: false

- name: Install socat (macOS)
  pkg:
    name: socat
    state: present
  when: brew_available and socat_check.rc != 0

- name: Install socat (Linux)
  pkg:
    name: socat
    state: present
  as_user: root
  when: apt_available and socat_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v socat
      exit_code: 0

- name: Display confirmation
  log: "socat installed"
