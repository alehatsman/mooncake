- name: Uninstall pyroscope (macOS)
  pkg:
    name: pyroscope
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall pyroscope (Linux)
  pkg:
    name: pyroscope
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v pyroscope
      exit_code: 1

- name: Display confirmation
  log: "pyroscope uninstalled"
