- name: Check if spark is installed
  shell: command -v spark
  as: spark_check
  failed_when: false

- name: Install spark
  pkg:
    name: spark
    state: present
  when: spark_check.rc != 0

- name: Verify installation
  shell: spark --version 2>&1 || spark -v 2>&1 || echo "installed"
  as: spark_version
- name: Display version
  log: "spark installed"
