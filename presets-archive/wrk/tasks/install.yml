- name: Check if wrk is installed
  shell: command -v wrk
  as: wrk_check
  failed_when: false

- name: Install wrk (macOS)
  pkg:
    name: wrk
    state: present
  when: brew_available and wrk_check.rc != 0

- name: Install wrk (Linux)
  pkg:
    name: wrk
    state: present
  as_user: root
  when: apt_available and wrk_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v wrk
      exit_code: 0

- name: Display confirmation
  log: "wrk installed"
