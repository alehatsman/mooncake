- name: Uninstall wrk (macOS)
  pkg:
    name: wrk
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall wrk (Linux)
  pkg:
    name: wrk
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v wrk
      exit_code: 1

- name: Display confirmation
  log: "wrk uninstalled"
