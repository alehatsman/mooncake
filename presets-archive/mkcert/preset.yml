name: mkcert
description: Install mkcert tool for generating locally-trusted HTTPS certificates
version: "1.0.0"
parameters:
  state:
    type: string
    required: false
    default: present
    enum: [present, absent]
steps:
  - name: Install mkcert
    import: tasks/install.yml
    when: parameters.state == "present"
  - name: Uninstall mkcert
    import: tasks/uninstall.yml
    when: parameters.state == "absent"
