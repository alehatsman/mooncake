- name: Uninstall quickwit (macOS)
  pkg:
    name: quickwit
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall quickwit (Linux)
  pkg:
    name: quickwit
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v quickwit
      exit_code: 1

- name: Display confirmation
  log: "quickwit uninstalled"
