- name: Uninstall tekton-cli (macOS)
  pkg:
    name: tekton-cli
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall tekton-cli (Linux)
  file.write:
    path: /usr/local/bin/tkn
    state: absent
  as_user: root
  when: linux
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v tkn
      exit_code: 1

- name: Display confirmation
  log: "tekton-cli uninstalled"
