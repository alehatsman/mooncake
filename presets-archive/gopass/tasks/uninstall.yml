- name: Uninstall gopass (macOS)
  pkg:
    name: gopass
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall gopass (Linux)
  pkg:
    name: gopass
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v gopass
      exit_code: 1

- name: Display confirmation
  log: "gopass uninstalled"
