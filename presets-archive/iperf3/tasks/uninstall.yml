- name: Uninstall iperf3 (macOS)
  pkg:
    name: iperf3
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall iperf3 (Linux)
  pkg:
    name: iperf3
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v iperf3
      exit_code: 1

- name: Display confirmation
  log: "iperf3 uninstalled"
