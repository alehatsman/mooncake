- name: Uninstall questdb (macOS)
  pkg:
    name: questdb
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall questdb (Linux)
  pkg:
    name: questdb
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v questdb
      exit_code: 1

- name: Display confirmation
  log: "questdb uninstalled"
