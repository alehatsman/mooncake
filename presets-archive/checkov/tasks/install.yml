- name: Check if checkov is installed
  shell: command -v checkov
  as: checkov_check
  failed_when: false

- name: Install checkov
  pkg:
    name: checkov
    state: present
  when: checkov_check.rc != 0

- name: Verify installation
  shell: checkov --version 2>&1 || checkov -v 2>&1 || echo "installed"
  as: checkov_version
- name: Display version
  log: "checkov installed"
- name: Verify installation with assert
  assert:
    command:
      cmd: command -v checkov
      exit_code: 0
