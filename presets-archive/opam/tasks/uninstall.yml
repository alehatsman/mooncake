- name: Uninstall opam (macOS)
  pkg:
    name: opam
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall opam (Linux)
  pkg:
    name: opam
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v opam
      exit_code: 1

- name: Display confirmation
  log: "opam uninstalled"
