- name: Uninstall trivy (macOS)
  pkg:
    name: trivy
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall trivy (Linux)
  pkg:
    name: trivy
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v trivy
      exit_code: 1

- name: Display confirmation
  log: "trivy uninstalled"
