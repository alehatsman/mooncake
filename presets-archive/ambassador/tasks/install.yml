- name: Check if ambassador is installed
  shell: command -v ambassador
  as: ambassador_check
  failed_when: false

- name: Install ambassador
  pkg:
    name: ambassador
    state: present
  when: ambassador_check.rc != 0

- name: Verify installation
  shell: ambassador --version 2>&1 || ambassador -v 2>&1 || echo "installed"
  as: ambassador_version
- name: Display version
  log: "ambassador installed"
