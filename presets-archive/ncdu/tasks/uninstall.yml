- name: Uninstall ncdu (macOS)
  pkg:
    name: ncdu
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall ncdu (Linux)
  pkg:
    name: ncdu
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v ncdu
      exit_code: 1

- name: Display confirmation
  log: "ncdu uninstalled"
