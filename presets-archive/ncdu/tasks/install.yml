- name: Check if ncdu is installed
  shell: command -v ncdu
  as: ncdu_check
  failed_when: false

- name: Install ncdu via Homebrew
  pkg:
    name: ncdu
    state: present
  when: brew_available and ncdu_check.rc != 0

- name: Install ncdu via apt
  pkg:
    name: ncdu
    state: present
  as_user: root
  when: apt_available and ncdu_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v ncdu
      exit_code: 0

- name: Display confirmation
  log: "ncdu installed"
