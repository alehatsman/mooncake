- name: Check if sonic is installed
  shell: command -v sonic
  as: sonic_check
  failed_when: false

- name: Install sonic
  pkg:
    name: sonic
    state: present
  when: sonic_check.rc != 0

- name: Verify installation
  shell: sonic --version 2>&1 || sonic -v 2>&1 || echo "installed"
  as: sonic_version
- name: Display version
  log: "sonic installed"
