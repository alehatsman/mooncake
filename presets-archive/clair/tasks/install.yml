- name: Check if clair is installed
  shell: command -v clair
  as: clair_check
  failed_when: false

- name: Install clair
  pkg:
    name: clair
    state: present
  when: clair_check.rc != 0

- name: Verify installation
  shell: clair --version 2>&1 || clair -v 2>&1 || echo "installed"
  as: clair_version
- name: Display version
  log: "clair installed"
- name: Verify installation with assert
  assert:
    command:
      cmd: command -v clair
      exit_code: 0
