- name: Uninstall masscan via Homebrew
  pkg:
    name: masscan
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall masscan via apt
  pkg:
    name: masscan
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v masscan
      exit_code: 1

- name: Display confirmation
  log: "masscan uninstalled"
