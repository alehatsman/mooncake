- name: Check if age is installed
  shell: command -v age
  as: age_check
  failed_when: false

- name: Install age
  pkg:
    name: age
    state: present
  when: age_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: age --version
      exit_code: 0

- name: Display version
  shell: age --version
  as: age_version
- name: Display version
  log: "age installed: {{ age_version.stdout }}"
