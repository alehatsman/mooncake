- name: Uninstall screen (macOS)
  pkg:
    name: screen
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall screen (Linux)
  pkg:
    name: screen
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v screen
      exit_code: 1

- name: Display confirmation
  log: "screen uninstalled"
