- name: Uninstall nmap (macOS)
  pkg:
    name: nmap
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall nmap (Linux)
  pkg:
    name: nmap
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v nmap
      exit_code: 1

- name: Display confirmation
  log: "nmap uninstalled"
