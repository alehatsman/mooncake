name: nmap
description: Network discovery and security scanner for port scanning and vulnerability assessment
version: "1.0.0"
parameters:
  state:
    type: string
    required: false
    default: present
    enum: [present, absent]
steps:
  - name: Install nmap
    import: tasks/install.yml
    when: parameters.state == "present"
  - name: Uninstall nmap
    import: tasks/uninstall.yml
    when: parameters.state == "absent"
