- name: Check if mongosh is installed
  shell: command -v mongosh
  as: mongosh_check
  failed_when: false

- name: Install mongosh (macOS)
  pkg:
    name: mongosh
    state: present
  when: brew_available and mongosh_check.rc != 0

- name: Install mongosh (Linux)
  pkg:
    name: mongodb-mongosh
    state: present
  as_user: root
  when: apt_available and mongosh_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v mongosh
      exit_code: 0

- name: Display version
  log: "mongosh installed"
