- name: Uninstall mongosh (macOS)
  pkg:
    name: mongosh
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall mongosh (Linux)
  pkg:
    name: mongodb-mongosh
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v mongosh
      exit_code: 1

- name: Display confirmation
  log: "mongosh uninstalled"
