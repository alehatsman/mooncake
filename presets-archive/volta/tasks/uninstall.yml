- name: Uninstall volta (macOS)
  pkg:
    name: volta
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall volta (Linux)
  shell: rm -rf ~/.volta
  when: linux
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v volta
      exit_code: 1

- name: Display confirmation
  log: "volta uninstalled"
