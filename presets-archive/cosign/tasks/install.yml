- name: Check if cosign is installed
  shell: command -v cosign
  as: cosign_check
  failed_when: false

- name: Install cosign
  pkg:
    name: cosign
    state: present
  when: cosign_check.rc != 0

- name: Verify installation
  shell: cosign --version 2>&1 || echo "installed"
  as: cosign_version
- name: Display version
  log: "cosign installed: {{ cosign_version.stdout }}"
- name: Verify installation with assert
  assert:
    command:
      cmd: command -v cosign
      exit_code: 0
