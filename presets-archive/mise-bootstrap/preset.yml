name: mise-bootstrap
description: |
  Install the mise version manager (https://mise.jdx.dev) into the
  mooncake tool store so subsequent `tool:` steps can use `backend: mise`.

  This preset closes the bootstrapping chicken-and-egg: the mise backend
  requires a `mise` binary, and `mise-bootstrap` is the declarative way
  to get one. After bootstrap, subsequent mise-backend steps in the same
  apply will find mise via the mooncake-managed fallback (no PATH update
  required mid-apply). To put mise on your interactive shell PATH, run
  `eval "$(mooncake tool env --shell zsh)"` (or your shell's equivalent).

version: 1.0.0

parameters:
  version:
    type: string
    required: true
    description: |
      Concrete mise version to install (without the leading `v`). Pin
      this to a known-good release so installs are reproducible.
      Example: "2026.5.6"

# Map mooncake's facts (os, arch) to mise's GitHub release asset
# conventions. mise uses "macos" instead of "darwin" and "x64" instead
# of "amd64". Arm64 is unchanged on both sides.
steps:
  - name: Set mise asset OS (linux)
    vars:
      mise_os: linux
    when: os == "linux"

  - name: Set mise asset OS (macos)
    vars:
      mise_os: macos
    when: os == "darwin"

  - name: Set mise asset arch (x64)
    vars:
      mise_arch: x64
    when: arch == "amd64"

  - name: Set mise asset arch (arm64)
    vars:
      mise_arch: arm64
    when: arch == "arm64"

  - name: Install mise via github-release
    tool:
      name: mise
      version: "{{ parameters.version }}"
      backend: github-release
      repo: jdx/mise
      asset: "mise-v{{ parameters.version }}-{{ mise_os }}-{{ mise_arch }}.tar.gz"
      strip_components: 1
      bin: bin/mise
