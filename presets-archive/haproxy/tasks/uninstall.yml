- name: Uninstall haproxy (macOS)
  pkg:
    name: haproxy
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall haproxy (Linux)
  pkg:
    name: haproxy
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v haproxy
      exit_code: 1

- name: Display confirmation
  log: "haproxy uninstalled"
