- name: Check if werf is installed
  shell: command -v werf
  as: werf_check
  failed_when: false

- name: Install werf (macOS)
  pkg:
    name: werf
    state: present
  when: brew_available and werf_check.rc != 0

- name: Install werf (Linux)
  shell: curl -sSL https://werf.io/install.sh | bash -s -- --ci
  when: linux and werf_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v werf
      exit_code: 0

- name: Display confirmation
  log: "werf installed"
