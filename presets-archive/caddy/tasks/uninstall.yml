# Caddy Uninstallation Tasks

- name: Stop Caddy service (Linux)
  os.service:
    name: caddy
    state: stopped
  as_user: root
  failed_when: false
  when: linux

- name: Stop Caddy service (macOS)
  shell: brew services stop caddy
  failed_when: false
  when: brew_available

# macOS Uninstallation
- name: Uninstall Caddy via Homebrew (macOS)
  pkg:
    name: caddy
    state: absent
  when: brew_available

# Linux Uninstallation
- name: Uninstall Caddy (Debian/Ubuntu)
  pkg:
    name: caddy
    state: absent
  as_user: root
  when: apt_available

- name: Uninstall Caddy (Fedora/RHEL)
  pkg:
    name: caddy
    state: absent
  as_user: root
  when: dnf_available

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v caddy
      exit_code: 1

- name: Display confirmation
  log: "caddy uninstalled"
