- name: Uninstall croc via Homebrew
  pkg:
    name: croc
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall croc via apt
  pkg:
    name: croc
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v croc
      exit_code: 1

- name: Display confirmation
  log: "croc uninstalled"
