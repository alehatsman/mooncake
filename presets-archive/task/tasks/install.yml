- name: Check if task is installed
  shell: command -v task
  as: task_check
  failed_when: false

- name: Install task via Homebrew
  pkg:
    name: task
    state: present
  when: brew_available and task_check.rc != 0

- name: Install task via apt
  pkg:
    name: task
    state: present
  as_user: root
  when: apt_available and task_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v task
      exit_code: 0

- name: Display confirmation
  log: "task installed"
