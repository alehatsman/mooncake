- name: Uninstall ctop via Homebrew
  pkg:
    name: ctop
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall ctop via apt
  pkg:
    name: ctop
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v ctop
      exit_code: 1

- name: Display confirmation
  log: "ctop uninstalled"
