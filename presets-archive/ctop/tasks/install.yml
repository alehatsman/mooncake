- name: Check if ctop is installed
  shell: command -v ctop
  as: ctop_check
  failed_when: false

- name: Install ctop via Homebrew
  pkg:
    name: ctop
    state: present
  when: brew_available and ctop_check.rc != 0

- name: Install ctop via apt
  pkg:
    name: ctop
    state: present
  as_user: root
  when: apt_available and ctop_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v ctop
      exit_code: 0

- name: Display confirmation
  log: "ctop installed"
