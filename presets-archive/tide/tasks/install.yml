- name: Check if tide is installed
  shell: command -v tide
  as: tide_check
  failed_when: false

- name: Install tide
  pkg:
    name: tide
    state: present
  when: tide_check.rc != 0

- name: Verify installation
  shell: tide --version 2>&1 || tide -v 2>&1 || echo "installed"
  as: tide_version
- name: Display version
  log: "tide installed"
