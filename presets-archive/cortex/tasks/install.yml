- name: Check if cortex is installed
  shell: command -v cortex
  as: cortex_check
  failed_when: false

- name: Install cortex
  pkg:
    name: cortex
    state: present
  when: cortex_check.rc != 0

- name: Verify installation
  shell: cortex --version 2>&1 || cortex -v 2>&1 || echo "installed"
  as: cortex_version
- name: Display version
  log: "cortex installed"
