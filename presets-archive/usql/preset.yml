name: usql
description: Universal SQL CLI
version: "1.0.0"
parameters:
  state:
    type: string
    required: false
    default: present
    enum: [present, absent]
steps:
  - name: Install usql
    import: tasks/install.yml
    when: parameters.state == "present"
  - name: Uninstall usql
    import: tasks/uninstall.yml
    when: parameters.state == "absent"
