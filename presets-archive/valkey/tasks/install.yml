- name: Check if valkey is installed
  shell: command -v valkey
  as: valkey_check
  failed_when: false

- name: Install valkey
  pkg:
    name: valkey
    state: present
  when: valkey_check.rc != 0

- name: Verify installation
  shell: valkey --version 2>&1 || valkey -v 2>&1 || echo "installed"
  as: valkey_version
- name: Display version
  log: "valkey installed"
