- name: Check if fleet is installed
  shell: command -v fleet
  as: fleet_check
  failed_when: false

- name: Install fleet
  pkg:
    name: fleet
    state: present
  when: fleet_check.rc != 0

- name: Verify installation
  shell: fleet --version 2>&1 || fleet -v 2>&1 || echo "installed"
  as: fleet_version
- name: Display version
  log: "fleet installed"
