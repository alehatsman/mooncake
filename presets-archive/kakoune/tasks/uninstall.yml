- name: Uninstall kakoune (macOS)
  pkg:
    name: kakoune
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall kakoune (Linux)
  pkg:
    name: kakoune
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v kak
      exit_code: 1

- name: Display confirmation
  log: "kakoune uninstalled"
