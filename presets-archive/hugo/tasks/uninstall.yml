- name: Uninstall hugo (macOS)
  pkg:
    name: hugo
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall hugo (Linux)
  pkg:
    name: hugo
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v hugo
      exit_code: 1

- name: Display confirmation
  log: "hugo uninstalled"
