- name: Check if contour is installed
  shell: command -v contour
  as: contour_check
  failed_when: false

- name: Install contour
  pkg:
    name: contour
    state: present
  when: contour_check.rc != 0

- name: Verify installation
  shell: contour --version 2>&1 || contour -v 2>&1 || echo "installed"
  as: contour_version
- name: Display version
  log: "contour installed"
