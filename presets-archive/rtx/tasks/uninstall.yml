- name: Uninstall rtx (macOS)
  pkg:
    name: rtx
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall rtx (Linux)
  pkg:
    name: rtx
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v rtx
      exit_code: 1

- name: Display confirmation
  log: "rtx uninstalled"
