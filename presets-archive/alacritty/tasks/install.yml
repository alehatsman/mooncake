- name: Check if alacritty is installed
  shell: command -v alacritty
  as: alacritty_check
  failed_when: false

- name: Install alacritty
  pkg:
    name: alacritty
    state: present
  when: alacritty_check.rc != 0

- name: Verify installation
  shell: alacritty --version 2>&1 || alacritty -v 2>&1 || echo "installed"
  as: alacritty_version
- name: Display version
  log: "alacritty installed"
- name: Verify installation with assert
  assert:
    command:
      cmd: command -v alacritty
      exit_code: 0
