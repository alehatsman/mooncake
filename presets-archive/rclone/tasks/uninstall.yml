- name: Uninstall rclone (macOS)
  pkg:
    name: rclone
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall rclone (Linux)
  pkg:
    name: rclone
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v rclone
      exit_code: 1

- name: Display confirmation
  log: "rclone uninstalled"
