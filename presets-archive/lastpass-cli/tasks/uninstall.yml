- name: Uninstall lastpass-cli (macOS)
  pkg:
    name: lastpass-cli
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall lastpass-cli (Linux)
  pkg:
    name: lastpass-cli
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v lpass
      exit_code: 1

- name: Display confirmation
  log: "lastpass-cli uninstalled"
