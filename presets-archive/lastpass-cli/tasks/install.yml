- name: Check if lpass is installed
  shell: command -v lpass
  as: lastpass_cli_check
  failed_when: false

- name: Install lastpass-cli (macOS)
  pkg:
    name: lastpass-cli
    state: present
  when: brew_available and lastpass_cli_check.rc != 0

- name: Install lastpass-cli (Linux)
  pkg:
    name: lastpass-cli
    state: present
  as_user: root
  when: apt_available and lastpass_cli_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v lpass
      exit_code: 0

- name: Display confirmation
  log: "lastpass-cli installed"
