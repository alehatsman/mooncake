- name: Check if aerospike is installed
  shell: command -v aerospike
  as: aerospike_check
  failed_when: false

- name: Install aerospike
  pkg:
    name: aerospike
    state: present
  when: aerospike_check.rc != 0

- name: Verify installation
  shell: aerospike --version 2>&1 || aerospike -v 2>&1 || echo "installed"
  as: aerospike_version
- name: Display version
  log: "aerospike installed"
