- name: Uninstall vultr-cli (macOS)
  pkg:
    name: vultr-cli
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall vultr-cli (Linux)
  file.write:
    path: /usr/local/bin/vultr
    state: absent
  as_user: root
  when: linux
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v vultr
      exit_code: 1

- name: Display confirmation
  log: "vultr-cli uninstalled"
