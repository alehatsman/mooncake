- name: Check if flink is installed
  shell: command -v flink
  as: flink_check
  failed_when: false

- name: Install flink
  pkg:
    name: flink
    state: present
  when: flink_check.rc != 0

- name: Verify installation
  shell: flink --version 2>&1 || flink -v 2>&1 || echo "installed"
  as: flink_version
- name: Assert flink is installed
  assert:
    command:
      cmd: command -v flink
      exit_code: 0

- name: Display version
  log: "flink installed"
