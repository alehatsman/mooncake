- name: Uninstall mtr (macOS)
  pkg:
    name: mtr
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall mtr (Linux)
  pkg:
    name: mtr
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v mtr
      exit_code: 1

- name: Display confirmation
  log: "mtr uninstalled"
