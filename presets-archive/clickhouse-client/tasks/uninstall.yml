- name: Uninstall clickhouse-client (macOS)
  pkg:
    name: clickhouse
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall clickhouse-client (Linux)
  pkg:
    name: clickhouse-client
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v clickhouse-client
      exit_code: 1

- name: Display confirmation
  log: "clickhouse-client uninstalled"
