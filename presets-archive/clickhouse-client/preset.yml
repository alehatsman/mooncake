name: clickhouse-client
description: ClickHouse client
version: "1.0.0"
parameters:
  state:
    type: string
    required: false
    default: present
    enum: [present, absent]
steps:
  - name: Install clickhouse-client
    import: tasks/install.yml
    when: parameters.state == "present"
  - name: Uninstall clickhouse-client
    import: tasks/uninstall.yml
    when: parameters.state == "absent"
