- name: Check if duf is installed
  shell: command -v duf
  as: duf_check
  failed_when: false

- name: Install duf
  pkg:
    name: duf
    state: present
  when: duf_check.rc != 0

- name: Verify installation
  shell: duf --version 2>&1 || echo "installed"
  as: duf_version
- name: Display version
  log: "duf installed: {{ duf_version.stdout }}"
- name: Verify installation with assert
  assert:
    command:
      cmd: command -v duf
      exit_code: 0
