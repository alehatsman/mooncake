- name: Uninstall miller (macOS)
  pkg:
    name: miller
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall miller (Linux)
  pkg:
    name: miller
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v miller
      exit_code: 1

- name: Display confirmation
  log: "miller uninstalled"
