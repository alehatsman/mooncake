- name: Check if borg is installed
  shell: command -v borg
  as: borg_check
  failed_when: false

- name: Install borgbackup via Homebrew
  pkg:
    name: borgbackup
    state: present
  when: brew_available and borg_check.rc != 0

- name: Install borgbackup via apt
  pkg:
    name: borgbackup
    state: present
  as_user: root
  when: apt_available and borg_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v borg
      exit_code: 0

- name: Display confirmation
  log: "borgbackup installed"
