- name: Uninstall borgbackup via Homebrew
  pkg:
    name: borgbackup
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall borgbackup via apt
  pkg:
    name: borgbackup
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v borg
      exit_code: 1

- name: Display confirmation
  log: "borgbackup uninstalled"
