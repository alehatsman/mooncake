- name: Check if clj is installed
  shell: command -v clj
  as: clojure_check
  failed_when: false

- name: Install clojure
  pkg:
    name: clojure
    state: present
  as_user: root
  when: clojure_check.rc != 0

- name: Verify installation
  shell: clj --version 2>&1 || clj -v 2>&1 || echo "installed"
  as: clojure_version
  continue_on_error: true
- name: Display version
  log: "clojure installed"
- name: Verify installation with assert
  assert:
    command:
      cmd: clj --version
      exit_code: 0
  continue_on_error: true
