- name: Uninstall ninja (macOS)
  pkg:
    name: ninja
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall ninja (Linux)
  pkg:
    name: ninja-build
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v ninja
      exit_code: 1

- name: Display confirmation
  log: "ninja uninstalled"
