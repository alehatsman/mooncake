- name: Uninstall gcloud (macOS)
  pkg:
    name: google-cloud-sdk
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall gcloud (Linux)
  pkg:
    name: google-cloud-sdk
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v gcloud
      exit_code: 1

- name: Display confirmation
  log: "gcloud uninstalled"
