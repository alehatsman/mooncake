- name: Uninstall rbenv (macOS)
  pkg:
    name: rbenv
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall rbenv (Linux)
  pkg:
    name: rbenv
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v rbenv
      exit_code: 1

- name: Display confirmation
  log: "rbenv uninstalled"
