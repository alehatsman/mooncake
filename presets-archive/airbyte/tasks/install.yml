- name: Check if airbyte is installed
  shell: command -v airbyte
  as: airbyte_check
  failed_when: false

- name: Install airbyte
  pkg:
    name: airbyte
    state: present
  when: airbyte_check.rc != 0

- name: Verify installation
  shell: airbyte --version 2>&1 || airbyte -v 2>&1 || echo "installed"
  as: airbyte_version
- name: Display version
  log: "airbyte installed"
