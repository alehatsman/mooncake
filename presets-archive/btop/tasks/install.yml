- name: Check if btop is installed
  shell: command -v btop
  as: btop_check
  failed_when: false

- name: Install btop
  pkg:
    name: btop
    state: present
  when: btop_check.rc != 0

- name: Verify installation
  shell: btop --version 2>&1 || echo "installed"
  as: btop_version
- name: Display version
  log: "btop installed: {{ btop_version.stdout }}"
- name: Verify installation with assert
  assert:
    command:
      cmd: command -v btop
      exit_code: 0
