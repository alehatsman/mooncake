- name: Uninstall elixir (macOS)
  pkg:
    name: elixir
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall elixir (Linux)
  pkg:
    name: elixir
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v mix
      exit_code: 1

- name: Display confirmation
  log: "mix uninstalled"
