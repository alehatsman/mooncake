- name: Check if mix is installed
  shell: command -v mix
  as: mix_check
  failed_when: false

- name: Install elixir (macOS)
  pkg:
    name: elixir
    state: present
  when: brew_available and mix_check.rc != 0

- name: Install elixir (Linux)
  pkg:
    name: elixir
    state: present
  as_user: root
  when: apt_available and mix_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v mix
      exit_code: 0

- name: Display version
  log: "mix installed"
