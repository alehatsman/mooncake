- name: Uninstall azure-cli via Homebrew
  pkg:
    name: azure-cli
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall azure-cli via apt
  pkg:
    name: azure-cli
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v az
      exit_code: 1

- name: Display confirmation
  log: "azure-cli uninstalled"
