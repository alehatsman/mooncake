- name: Uninstall graphviz (macOS)
  pkg:
    name: graphviz
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall graphviz (Linux)
  pkg:
    name: graphviz
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v dot
      exit_code: 1

- name: Display confirmation
  log: "graphviz uninstalled"
