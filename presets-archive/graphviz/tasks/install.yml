- name: Check if dot is installed
  shell: command -v dot
  as: graphviz_check
  failed_when: false

- name: Install graphviz (macOS)
  pkg:
    name: graphviz
    state: present
  when: brew_available and graphviz_check.rc != 0

- name: Install graphviz (Linux)
  pkg:
    name: graphviz
    state: present
  as_user: root
  when: apt_available and graphviz_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v dot
      exit_code: 0

- name: Display confirmation
  log: "graphviz installed"
