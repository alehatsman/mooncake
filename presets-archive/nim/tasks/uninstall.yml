- name: Uninstall nim (macOS)
  pkg:
    name: nim
    state: absent
  when: brew_available
  failed_when: false

- name: Uninstall nim (Linux)
  pkg:
    name: nim
    state: absent
  as_user: root
  when: apt_available
  failed_when: false

- name: Verify uninstallation with assert
  assert:
    command:
      cmd: command -v nim
      exit_code: 1

- name: Display confirmation
  log: "nim uninstalled"
