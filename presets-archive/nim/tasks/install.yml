- name: Check if nim is installed
  shell: command -v nim
  as: nim_check
  failed_when: false

- name: Install nim via Homebrew
  pkg:
    name: nim
    state: present
  when: brew_available and nim_check.rc != 0

- name: Install nim via apt
  pkg:
    name: nim
    state: present
  as_user: root
  when: apt_available and nim_check.rc != 0

- name: Verify installation with assert
  assert:
    command:
      cmd: command -v nim
      exit_code: 0

- name: Display confirmation
  log: "nim installed"
