# go-task entry point for mooncake — https://taskfile.dev
#
# This file is the canonical "what commands does an agent or human run
# to develop / verify / install" surface. The Makefile is kept for
# back-compat with existing docs and CI scripts but new flows should
# add tasks here.
#
# Quick reference:
#   task                  # list available tasks
#   task install-tools    # install every static-analysis tool the project needs
#   task ci               # full pre-push gate: build + test + lint + scan + analysis + arch
#   task ci:fast          # fast pre-commit gate: vet + fmt + ai-lint + budget
#   task ai-lint          # AI-smell sweep on staged Go files
#   task build / test / lint / scan
version: '3'

vars:
  PKG: ./...
  BIN: out/mooncake

tasks:

  # ---------------------------------------------------------------------------
  # Default — `task` with no args prints the task list.
  # ---------------------------------------------------------------------------
  default:
    desc: List available tasks
    cmds:
      - task --list-all
    silent: true

  # ---------------------------------------------------------------------------
  # Tool installation. Inline `go install` commands — no separate script.
  # Idempotent: re-running picks up newer versions.
  # ---------------------------------------------------------------------------
  install-tools:
    desc: Install every static-analysis tool the project depends on
    cmds:
      - echo "→ Installing golangci-lint..."
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - echo "→ Installing govulncheck..."
      - go install golang.org/x/vuln/cmd/govulncheck@latest
      - echo "→ Installing gosec..."
      - go install github.com/securego/gosec/v2/cmd/gosec@latest
      - echo "→ Installing gocyclo (arch-snapshot complexity)..."
      - go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
      - echo "→ Installing goda (arch-snapshot dep graph)..."
      - go install github.com/loov/goda@latest
      - echo "→ Installing dupl (code-duplication report)..."
      - go install github.com/mibk/dupl@latest
      - echo ""
      - echo "✓ Tools installed. Verify with 'task check-tools'."

  check-tools:
    desc: Report which static-analysis tools are installed
    cmds:
      - |
        missing=0
        for tool in golangci-lint govulncheck gosec gocyclo goda dupl; do
          if command -v "$tool" >/dev/null 2>&1 || [ -x "$(go env GOPATH)/bin/$tool" ]; then
            printf "  ✓ %s\n" "$tool"
          else
            printf "  ✗ %s — MISSING\n" "$tool"
            missing=$((missing + 1))
          fi
        done
        if [ "$missing" -gt 0 ]; then
          echo ""
          echo "$missing tool(s) missing. Run: task install-tools"
          exit 1
        fi
    silent: true

  # ---------------------------------------------------------------------------
  # Build / test
  # ---------------------------------------------------------------------------
  build:
    desc: Build the mooncake binary
    cmds:
      - go build -v -o {{.BIN}} ./cmd

  test:
    desc: Run go test ./...
    cmds:
      - go test {{.PKG}}

  test-race:
    desc: Run go test -race ./...
    cmds:
      - go test -race {{.PKG}}

  # ---------------------------------------------------------------------------
  # Lint + security + vulnerability scans
  # ---------------------------------------------------------------------------
  lint:
    desc: golangci-lint (includes gosec via .golangci.yml)
    cmds:
      - golangci-lint run {{.PKG}}

  vuln:
    desc: govulncheck
    cmds:
      - govulncheck {{.PKG}}

  scan:
    desc: Security + vulnerability scan (lint + vuln)
    deps: [lint, vuln]

  # ---------------------------------------------------------------------------
  # Generated-artifact freshness checks (used by CI; pre-commit runs the
  # regen step first via task regen so locally-edited generators don't
  # trip the check).
  # ---------------------------------------------------------------------------
  docs-check:
    desc: Verify generated docs are up to date
    cmds:
      - make docs-check

  schema-check:
    desc: Verify generated JSON schema is up to date
    cmds:
      - make schema-check

  regen:
    desc: Regenerate docs + schema (run before commit so the *-check tasks pass)
    cmds:
      - make docs-generate
      - make schema-generate

  # ---------------------------------------------------------------------------
  # Architecture / analysis reports
  # ---------------------------------------------------------------------------
  arch-snapshot:
    desc: Regenerate docs-working/ARCH_SNAPSHOT.md (gitignored; local read-only)
    cmds:
      - bash ./scripts/arch-snapshot.sh

  budget-status:
    desc: Show current state of the three CLAUDE.md soft caps
    cmds:
      - bash ./scripts/budget-status.sh

  dupl:
    desc: 'Code-duplication report (production only). Override threshold with T= (default 100)'
    vars:
      T: '{{.T | default "100"}}'
    cmds:
      - |
        dupl -threshold {{.T}} -plumbing . 2>&1 | grep -v "_test.go" | python3 -c '
        import sys
        pairs = set()
        for line in sys.stdin:
            parts = line.strip().split(": duplicate of ")
            if len(parts) != 2: continue
            pairs.add(tuple(sorted(parts)))
        def n(rng):
            lo, hi = rng.split(":")[-1].split("-"); return int(hi) - int(lo) + 1
        ranked = sorted(pairs, key=lambda p: -n(p[0]))
        print(f"{len(ranked)} production clone pair(s) at threshold {{.T}}")
        for a, b in ranked:
            print(f"  {n(a):>3}L  {a}  <-->  {b}")
        '
    silent: true

  # ---------------------------------------------------------------------------
  # AI-smell sweep — patterns LLM agents tend to leave behind (stub panics,
  # agent-tagged TODOs, comments that reference the prompt). Runs as part
  # of `ci:fast` on pre-commit. See scripts/ai-lint.sh for the rule list
  # and the rationale for what's intentionally NOT flagged.
  # ---------------------------------------------------------------------------
  ai-lint:
    desc: 'AI-smell sweep on staged Go files (stub panics, agent TODOs, prompt artifacts)'
    cmds:
      - bash ./scripts/ai-lint.sh

  ai-lint-all:
    desc: 'AI-smell sweep on every tracked Go file'
    cmds:
      - bash ./scripts/ai-lint.sh --all

  # ---------------------------------------------------------------------------
  # Fast gate — runs at pre-commit time. Cheap checks only (<5s on warm
  # cache) so agents iterate without reaching for --no-verify. The
  # heavyweight build + race tests + lint + scan live in `ci` and run at
  # pre-push time.
  # ---------------------------------------------------------------------------
  ci:fast:
    desc: 'Fast pre-commit gate: vet + gofmt (staged) + ai-lint (staged) + budget + docs-regen (gated)'
    cmds:
      - task: ci-fast:vet
      - task: ci-fast:fmt
      - task: ci-fast:ai-lint
      - task: ci-fast:budget
      - task: ci-fast:docs-regen
      - echo ""
      - echo "✓ Fast checks green — full 'task ci' gate runs on push."

  ci-fast:vet:
    internal: true
    cmds:
      - 'echo "[1/5] go vet"'
      - go vet {{.PKG}}

  ci-fast:fmt:
    internal: true
    cmds:
      - 'echo "[2/5] gofmt (staged Go files)"'
      - |
        staged=$(git diff --cached --name-only --diff-filter=ACMR -- '*.go' || true)
        if [ -z "$staged" ]; then echo "  (no staged Go files)"; exit 0; fi
        bad=$(echo "$staged" | xargs gofmt -l 2>/dev/null || true)
        if [ -n "$bad" ]; then
          echo "  ✗ gofmt would change:" >&2
          echo "$bad" | sed 's/^/    /' >&2
          echo "  fix with: gofmt -w <files>" >&2
          exit 1
        fi
        echo "  ✓ all staged files formatted"

  ci-fast:ai-lint:
    internal: true
    cmds:
      - 'echo "[3/5] ai-lint (staged Go files)"'
      - bash ./scripts/ai-lint.sh

  ci-fast:budget:
    internal: true
    cmds:
      - 'echo "[4/5] CLAUDE.md soft-cap budget"'
      - bash ./scripts/budget-status.sh | sed 's/^/  /'

  # docs-regen runs when staged Go files could change generator output
  # (action handlers, Step schema, the docgen package itself, the docs
  # command). On drift it auto-stages docs-next/generated/* so the
  # commit ships the regenerated docs alongside the source change —
  # matching the cmd/docs.go header-strip equality check (only real
  # content deltas land, timestamp-only writes are already skipped).
  ci-fast:docs-regen:
    internal: true
    cmds:
      - 'echo "[5/5] docs regen (gated on action/config/docgen changes)"'
      - |
        staged=$(git diff --cached --name-only --diff-filter=ACMR \
          -- 'internal/actions/**/*.go' \
             'internal/config/*.go' \
             'internal/docgen/**/*.go' \
             'internal/schemagen/**/*.go' \
             'cmd/docs.go' 'cmd/schema.go' 2>/dev/null || true)
        if [ -z "$staged" ]; then
          echo "  (no action/config/docgen Go files staged — skipping)"
          exit 0
        fi
        if ! make docs-generate >/dev/null 2>&1; then
          echo "  ✗ make docs-generate failed — fix the generator before committing." >&2
          exit 1
        fi
        if ! make schema-generate >/dev/null 2>&1; then
          echo "  ✗ make schema-generate failed — fix the generator before committing." >&2
          exit 1
        fi
        changed=$(git diff --name-only -- \
          docs-next/generated/ \
          internal/config/schema.json \
          internal/config/schema.d \
          mooncake.d.ts)
        if [ -z "$changed" ]; then
          echo "  ✓ generated docs + schema already in sync"
          exit 0
        fi
        echo "$changed" | sed 's/^/  ↑ auto-staging: /'
        git add -- \
          docs-next/generated/ \
          internal/config/schema.json \
          internal/config/schema.d \
          mooncake.d.ts

  # ---------------------------------------------------------------------------
  # CI — the full gate. Runs at pre-push time (and in CI). Steps run in
  # dependency order; first failure stops the pipeline and exits non-zero.
  # Echoes a per-stage banner so the output is easy to scan in CI logs and
  # pre-push transcripts.
  # ---------------------------------------------------------------------------
  ci:
    desc: 'Full pre-push gate: build + test-race + lint + scan + docs/schema + arch + budget + dupl'
    cmds:
      - task: ci:build
      - task: ci:test
      # - task: ci:test-race
      - task: ci:lint
      - task: ci:vuln
      - task: ci:regen-and-check
      - task: ci:arch
      - task: ci:budget
      - task: ci:dupl
      - echo ""
      - echo "✓ All checks green — safe to commit."

  ci:build:
    internal: true
    cmds:
      - 'echo "[1/8] build"'
      - go build -o {{.BIN}} ./cmd

  ci:test:
    internal: true
    cmds:
      - 'echo "[2/8] test"'
      - go test {{.PKG}}

  ci:test-race:
    internal: true
    cmds:
      - 'echo "[2/8] test -race"'
      - go test -race {{.PKG}}

  ci:lint:
    internal: true
    cmds:
      - 'echo "[3/8] golangci-lint"'
      - golangci-lint run {{.PKG}}

  ci:vuln:
    internal: true
    cmds:
      - 'echo "[4/8] govulncheck"'
      - govulncheck {{.PKG}}

  ci:regen-and-check:
    internal: true
    cmds:
      - 'echo "[5/8] regen docs + schema, then verify clean"'
      - make docs-generate >/dev/null
      - make schema-generate >/dev/null
      - make docs-check
      - make schema-check

  # Non-blocking analysis stages — each prints its findings so an
  # agent reading the pre-commit transcript can decide whether to
  # address them before the commit lands. None of them fails the
  # gate; they're review-time prompts, not hard rules.
  ci:arch:
    internal: true
    cmds:
      - 'echo "[6/8] arch-snapshot (regenerated; file is gitignored)"'
      - bash ./scripts/arch-snapshot.sh >/dev/null
      - |
        f=docs-working/ARCH_SNAPSHOT.md
        if [ ! -f "$f" ]; then echo "  (snapshot file missing — skipping summary)"; exit 0; fi
        # Top 5 packages by LOC (the Packages section is a markdown table).
        echo "  Top packages by LOC:"
        awk '/^\| `/{print "    " $0}' "$f" | head -5
        # God files + hotspot sections are fenced code blocks of plain
        # "<n> <path>" lines. Filter by leading-digit lines inside the
        # section range.
        god=$(awk '/^## God files/,/^## [^G]/' "$f" | grep -cE '^[[:space:]]*[0-9]+ ' || true)
        echo "  God files (>500 LOC, non-test): $god"
        echo "  Top cyclomatic hotspots:"
        awk '/^## Cyclomatic hotspots/,/^## [^C]/' "$f" | grep -E '^[[:space:]]*[0-9]+ ' | head -3 | sed 's/^/    /'

  ci:budget:
    internal: true
    cmds:
      - 'echo "[7/8] CLAUDE.md soft-cap budget"'
      - bash ./scripts/budget-status.sh | sed 's/^/  /'

  ci:dupl:
    internal: true
    cmds:
      - 'echo "[8/8] dupl (production-code duplication report)"'
      - |
        if ! command -v dupl >/dev/null 2>&1 && ! [ -x "$(go env GOPATH)/bin/dupl" ]; then
          echo "  dupl not installed — run 'task install-tools'. Skipping."
          exit 0
        fi
        dupl -threshold 100 -plumbing . 2>&1 | grep -v "_test.go" | python3 -c '
        import sys
        pairs = set()
        for line in sys.stdin:
            parts = line.strip().split(": duplicate of ")
            if len(parts) == 2:
                pairs.add(tuple(sorted(parts)))
        def n(rng):
            lo, hi = rng.split(":")[-1].split("-"); return int(hi) - int(lo) + 1
        ranked = sorted(pairs, key=lambda p: -n(p[0]))
        if not ranked:
            print("  no production duplication at threshold 100.")
        else:
            print(f"  {len(ranked)} production clone pair(s) at threshold 100 (informational):")
            for a, b in ranked:
                print(f"    {n(a):>3}L  {a}  <-->  {b}")
        '
