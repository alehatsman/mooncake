# go-task entry point for mooncake — https://taskfile.dev
#
# Quick reference:
#   task                  # list available tasks
#   task install-tools    # install every static-analysis tool the project needs
#   task ci               # full pre-push gate: build + test + lint + scan + docs/schema + arch + budget + dupl
#   task ci:fast          # fast pre-commit gate: vet + fmt + ai-lint + budget + docs-regen (gated)
#   task ai-lint          # AI-smell sweep on staged Go files
#   task build / test / lint / scan
version: '3'

vars:
  PKG: ./...
  BIN: out/mooncake

tasks:

  # ---------------------------------------------------------------------------
  # Default — `task` with no args prints the task list.
  # ---------------------------------------------------------------------------
  default:
    desc: List available tasks
    cmds:
      - task --list-all
    silent: true

  # ---------------------------------------------------------------------------
  # Tool installation. Idempotent: re-running picks up newer versions.
  # ---------------------------------------------------------------------------
  install-tools:
    desc: Install every static-analysis tool the project depends on
    cmds:
      - echo "→ Installing golangci-lint..."
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - echo "→ Installing govulncheck..."
      - go install golang.org/x/vuln/cmd/govulncheck@latest
      - echo "→ Installing gosec..."
      - go install github.com/securego/gosec/v2/cmd/gosec@latest
      - echo "→ Installing gocyclo (arch-snapshot complexity)..."
      - go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
      - echo "→ Installing goda (arch-snapshot dep graph)..."
      - go install github.com/loov/goda@latest
      - echo "→ Installing dupl (code-duplication report)..."
      - go install github.com/mibk/dupl@latest
      - echo ""
      - echo "✓ Tools installed. Verify with 'task check-tools'."

  check-tools:
    desc: Report which static-analysis tools are installed
    cmds:
      - |
        missing=0
        for tool in golangci-lint govulncheck gosec gocyclo goda dupl; do
          if command -v "$tool" >/dev/null 2>&1 || [ -x "$(go env GOPATH)/bin/$tool" ]; then
            printf "  ✓ %s\n" "$tool"
          else
            printf "  ✗ %s — MISSING\n" "$tool"
            missing=$((missing + 1))
          fi
        done
        if [ "$missing" -gt 0 ]; then
          echo ""
          echo "$missing tool(s) missing. Run: task install-tools"
          exit 1
        fi
    silent: true

  # ---------------------------------------------------------------------------
  # Build / install / clean
  # ---------------------------------------------------------------------------
  build:
    desc: Build the mooncake binary
    cmds:
      - go build -v -o {{.BIN}} ./cmd

  install:
    desc: Build and install mooncake to /usr/local/bin
    cmds:
      - task: build
      # install(1) unlinks-then-creates atomically, so this works even
      # when the target is in use by a running agentd ("Text file busy").
      - sudo install -m 0755 {{.BIN}} /usr/local/bin/mooncake
      - echo "✓ Installed /usr/local/bin/mooncake"
      - cmd: |
          if command -v systemctl >/dev/null 2>&1 && systemctl is-active --quiet mooncake-agentd 2>/dev/null; then
            sudo systemctl restart mooncake-agentd && echo "✓ Restarted mooncake-agentd"
          fi
        silent: true

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf out/ testing-output/
      - echo "✓ Cleaned"

  # ---------------------------------------------------------------------------
  # Test
  # ---------------------------------------------------------------------------
  test:
    desc: Run go test ./...
    cmds:
      - go test {{.PKG}}

  test-race:
    desc: Run go test -race ./...
    cmds:
      - go test -race {{.PKG}}

  test-cover:
    desc: Run tests with HTML coverage report (testing-output/coverage.html)
    cmds:
      - mkdir -p testing-output
      - go test -coverprofile=testing-output/coverage.out -covermode=atomic {{.PKG}}
      - go tool cover -html=testing-output/coverage.out -o testing-output/coverage.html
      - 'echo "✓ Coverage report: testing-output/coverage.html"'

  # Scoped targets — pass PKG=relative/path (no ./ prefix), e.g. task test-pkg PKG=internal/apply
  build-pkg:
    desc: 'Build a single package — usage: task build-pkg PKG=internal/apply'
    cmds:
      - |
        [ -n "{{.PKG}}" ] || { echo "usage: task build-pkg PKG=internal/foo" >&2; exit 2; }
        go build ./{{.PKG}}/...

  test-pkg:
    desc: 'Test a single package with -race — usage: task test-pkg PKG=internal/apply'
    cmds:
      - |
        [ -n "{{.PKG}}" ] || { echo "usage: task test-pkg PKG=internal/foo" >&2; exit 2; }
        go test -race -count=1 ./{{.PKG}}/...

  test-fn:
    desc: 'Run a single test function — usage: task test-fn FN=TestName PKG=internal/apply'
    cmds:
      - |
        [ -n "{{.FN}}" ]  || { echo "usage: task test-fn FN=TestName PKG=internal/foo" >&2; exit 2; }
        [ -n "{{.PKG}}" ] || { echo "usage: task test-fn FN=TestName PKG=internal/foo" >&2; exit 2; }
        go test -race -count=1 -run '{{.FN}}' -v ./{{.PKG}}/...

  lint-pkg:
    desc: 'Lint a single package — usage: task lint-pkg PKG=internal/apply'
    cmds:
      - |
        [ -n "{{.PKG}}" ] || { echo "usage: task lint-pkg PKG=internal/foo" >&2; exit 2; }
        golangci-lint run ./{{.PKG}}/...

  check-pkg:
    desc: 'Build + test + lint a single package — usage: task check-pkg PKG=internal/apply'
    cmds:
      - task: build-pkg
      - task: test-pkg
      - task: lint-pkg
      - echo "✓ check-pkg {{.PKG}}"

  # ---------------------------------------------------------------------------
  # Lint + format
  # ---------------------------------------------------------------------------
  lint:
    desc: golangci-lint (includes gosec via .golangci.yml)
    cmds:
      - golangci-lint run {{.PKG}}

  lint-new:
    desc: golangci-lint on lines changed since HEAD~1 (refactor-friendly)
    cmds:
      - golangci-lint run --new-from-rev=HEAD~1 {{.PKG}}

  lint-fix:
    desc: Auto-fix what golangci-lint can fix (misspell, unconvert, staticcheck QF/S, revive)
    cmds:
      - golangci-lint run --fix {{.PKG}}

  fmt:
    desc: Format code with gofmt -s
    cmds:
      - gofmt -s -w .
      - echo "✓ Code formatted"

  # ---------------------------------------------------------------------------
  # Security + vulnerability scans
  # ---------------------------------------------------------------------------
  vuln:
    desc: govulncheck
    cmds:
      - govulncheck {{.PKG}}

  scan:
    desc: Security + vulnerability scan (lint + vuln)
    deps: [lint, vuln]

  # ---------------------------------------------------------------------------
  # Documentation — generate and check
  # ---------------------------------------------------------------------------
  docs-generate:
    desc: Generate documentation from code (actions, schema, properties)
    deps: [build]
    cmds:
      - mkdir -p docs-next/generated
      - '{{.BIN}} docs generate --section all --output docs-next/generated/actions.md'
      - '{{.BIN}} docs generate --section schema --output docs-next/generated/schema.md'
      - '{{.BIN}} docs generate --section action-properties --output docs-next/generated/properties.md'
      - echo "✓ Generated docs-next/generated/{actions,schema,properties}.md"

  docs-check:
    desc: Verify generated docs are up to date
    deps: [build]
    cmds:
      - |
        mkdir -p .tmp/docs-check
        {{.BIN}} docs generate --section all --output .tmp/docs-check/actions.md >/dev/null 2>&1
        {{.BIN}} docs generate --section schema --output .tmp/docs-check/schema.md >/dev/null 2>&1
        {{.BIN}} docs generate --section action-properties --output .tmp/docs-check/properties.md >/dev/null 2>&1
        failed=0
        for file in actions.md schema.md properties.md; do
          grep -v "Generated: " docs-next/generated/$file > .tmp/docs-check/current_$file 2>/dev/null || true
          grep -v "Generated: " .tmp/docs-check/$file > .tmp/docs-check/new_$file 2>/dev/null || true
          if ! diff -q .tmp/docs-check/current_$file .tmp/docs-check/new_$file >/dev/null 2>&1; then
            if [ $failed -eq 0 ]; then
              echo "✗ Documentation is out of sync!"
              echo ""
              echo "The following files have changed:"
              failed=1
            fi
            echo "docs-next/generated/$file"
          fi
        done
        rm -rf .tmp/docs-check
        if [ $failed -eq 1 ]; then
          echo ""
          echo "Run 'task docs-generate' to update documentation."
          exit 1
        fi
        echo "✓ Documentation is up to date"

  docs-clean:
    desc: Remove generated documentation
    cmds:
      - rm -rf docs-next/generated/
      - echo "✓ Cleaned generated docs"

  docs-serve:
    desc: Build and serve documentation site (requires pipenv + mkdocs)
    cmds:
      - pipenv run mkdocs build
      - pipenv run mkdocs serve

  # ---------------------------------------------------------------------------
  # Schema — generate and check
  # ---------------------------------------------------------------------------
  schema-generate:
    desc: Generate JSON Schema + TypeScript types from code
    deps: [build]
    cmds:
      - '{{.BIN}} schema generate --format json --output internal/config/schema.json --strict'
      - '{{.BIN}} schema generate --format typescript --output internal/config/schema.d'
      - '{{.BIN}} schema generate --format typescript --output mooncake.d.ts'
      - echo "✓ Generated internal/config/schema.json + mooncake.d.ts"

  schema-check:
    desc: Verify generated JSON schema is up to date
    deps: [build]
    cmds:
      - |
        mkdir -p .tmp/schema-check
        {{.BIN}} schema generate --format json --output .tmp/schema-check/schema.json --strict >/dev/null 2>&1
        if diff -q internal/config/schema.json .tmp/schema-check/schema.json >/dev/null 2>&1; then
          rm -rf .tmp/schema-check
          echo "✓ Schema is up to date"
        else
          rm -rf .tmp/schema-check
          echo "✗ Schema is out of sync!"
          echo ""
          echo "Run 'task schema-generate' to update schema."
          exit 1
        fi

  regen:
    desc: Regenerate docs + schema (run before commit so the *-check tasks pass)
    cmds:
      - task: docs-generate
      - task: schema-generate

  # ---------------------------------------------------------------------------
  # Architecture / analysis reports
  # ---------------------------------------------------------------------------
  arch-snapshot:
    desc: Regenerate docs-working/ARCH_SNAPSHOT.md (gitignored; local read-only)
    cmds:
      - bash ./scripts/arch-snapshot.sh

  budget-status:
    desc: Show current state of the three CLAUDE.md soft caps
    cmds:
      - bash ./scripts/budget-status.sh

  dupl:
    desc: 'Code-duplication report (production only). Override threshold with T= (default 100)'
    vars:
      T: '{{.T | default "100"}}'
    cmds:
      - |
        dupl -threshold {{.T}} -plumbing . 2>&1 | grep -v "_test.go" | python3 -c '
        import sys
        pairs = set()
        for line in sys.stdin:
            parts = line.strip().split(": duplicate of ")
            if len(parts) != 2: continue
            pairs.add(tuple(sorted(parts)))
        def n(rng):
            lo, hi = rng.split(":")[-1].split("-"); return int(hi) - int(lo) + 1
        ranked = sorted(pairs, key=lambda p: -n(p[0]))
        print(f"{len(ranked)} production clone pair(s) at threshold {{.T}}")
        for a, b in ranked:
            print(f"  {n(a):>3}L  {a}  <-->  {b}")
        '
    silent: true

  # ---------------------------------------------------------------------------
  # AI-smell sweep
  # ---------------------------------------------------------------------------
  ai-lint:
    desc: 'AI-smell sweep on staged Go files (stub panics, agent TODOs, prompt artifacts)'
    cmds:
      - bash ./scripts/ai-lint.sh

  ai-lint-all:
    desc: 'AI-smell sweep on every tracked Go file'
    cmds:
      - bash ./scripts/ai-lint.sh --all

  escalation-lint:
    desc: 'spec-72 §G1: report direct security.BecomeRunner/PrivilegedRunner constructs outside the allowlist (warning-only in Phase 2)'
    cmds:
      - bash ./scripts/escalation-lint.sh

  # ---------------------------------------------------------------------------
  # gopls-backed structural lookups — collapse grep+Read cycles
  # Usage: task sym Q=Runner | task refs LOC=internal/apply/runner.go:12:6
  # ---------------------------------------------------------------------------
  sym:
    desc: 'Fuzzy workspace symbol search — usage: task sym Q=Runner'
    cmds:
      - |
        [ -n "{{.Q}}" ] || { echo "usage: task sym Q='SymbolName'" >&2; exit 2; }
        gopls workspace_symbol "{{.Q}}"

  doc:
    desc: 'Print docs for a symbol — usage: task doc SYM=fmt.Sprintf'
    cmds:
      - |
        [ -n "{{.SYM}}" ] || { echo "usage: task doc SYM=pkg.Symbol" >&2; exit 2; }
        go doc "{{.SYM}}"

  refs:
    desc: 'Find references — usage: task refs LOC=internal/apply/runner.go:12:6'
    cmds:
      - |
        [ -n "{{.LOC}}" ] || { echo "usage: task refs LOC=file:line:col" >&2; exit 2; }
        gopls references "{{.LOC}}"

  callers:
    desc: 'Show call hierarchy — usage: task callers LOC=internal/apply/runner.go:12:6'
    cmds:
      - |
        [ -n "{{.LOC}}" ] || { echo "usage: task callers LOC=file:line:col" >&2; exit 2; }
        gopls call_hierarchy "{{.LOC}}"

  impl:
    desc: 'Find interface implementations — usage: task impl LOC=internal/actions/interfaces.go:15:6'
    cmds:
      - |
        [ -n "{{.LOC}}" ] || { echo "usage: task impl LOC=file:line:col" >&2; exit 2; }
        gopls implementation "{{.LOC}}"

  agent-help:
    desc: Show AGENT.md (agent-focused shortcut reference)
    cmds:
      - cat AGENT.md 2>/dev/null || echo "AGENT.md not found"

  # ---------------------------------------------------------------------------
  # Pilot eval harness
  # ---------------------------------------------------------------------------
  pilot-evals:
    desc: 'Run mooncake pilot evals — REQUIRES MOONCAKE_PILOT_EVAL=1 (costs API tokens)'
    cmds:
      - |
        if [ "$MOONCAKE_PILOT_EVAL" != "1" ]; then
          echo "task pilot-evals: refusing to run — set MOONCAKE_PILOT_EVAL=1 to opt in."
          echo "                  (real LLM calls cost real money. Use 'task pilot-evals-dry' for a no-cost shape check.)"
          exit 2
        fi
        go run ./testing-next/pilot-evals/

  pilot-evals-dry:
    desc: Validate pilot-eval harness without an LLM call
    cmds:
      - go run ./testing-next/pilot-evals/ -dry-run

  # ---------------------------------------------------------------------------
  # Release
  # ---------------------------------------------------------------------------
  release:
    desc: Create a new release (runs release script)
    cmds:
      - bash ./scripts/release.sh

  ubuntu-ci:
    desc: Run full CI suite in Ubuntu Docker container (cross-platform verification)
    cmds:
      - |
        echo "Running CI in Ubuntu Docker container..."
        docker run --rm -v "$PWD":/workspace -w /workspace golang:1.26.3 bash -c "
          set -e
          echo '==> Installing CI dependencies...'
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b /usr/local/bin latest >/dev/null 2>&1
          go install golang.org/x/vuln/cmd/govulncheck@latest 2>/dev/null
          go install github.com/securego/gosec/v2/cmd/gosec@latest 2>/dev/null
          echo '==> Installing task...'
          sh -c \"\$(curl --location https://taskfile.dev/install.sh)\" -- -d -b /usr/local/bin 2>/dev/null
          echo '==> Running task ci...'
          task ci
        "
        echo ""
        echo "✓ Ubuntu CI checks passed!"

  test-presets-help:
    desc: Show preset testing help (testing-next/)
    cmds:
      - |
        echo "Preset testing has moved to testing-next/"
        echo ""
        echo "Quick start:"
        echo "  cd testing-next && task"
        echo ""
        echo "Common commands:"
        echo "  cd testing-next && task test-ubuntu          # Test all presets (native arch)"
        echo "  cd testing-next && task test-preset PRESET=jq  # Test single preset"
        echo "  cd testing-next && task clean-all            # Cleanup"

  # ---------------------------------------------------------------------------
  # Fast gate — pre-commit. Cheap checks only (<5s on warm cache).
  # ---------------------------------------------------------------------------
  ci:fast:
    desc: 'Fast pre-commit gate: vet + gofmt (staged) + ai-lint (staged) + budget + docs-regen (gated)'
    cmds:
      - task: ci-fast:vet
      - task: ci-fast:fmt
      - task: ci-fast:ai-lint
      - task: ci-fast:budget
      - task: ci-fast:docs-regen
      - echo ""
      - echo "✓ Fast checks green — full 'task ci' gate runs on push."

  ci-fast:vet:
    internal: true
    cmds:
      - 'echo "[1/5] go vet"'
      - go vet {{.PKG}}

  ci-fast:fmt:
    internal: true
    cmds:
      - 'echo "[2/5] gofmt (staged Go files)"'
      - |
        staged=$(git diff --cached --name-only --diff-filter=ACMR -- '*.go' || true)
        if [ -z "$staged" ]; then echo "  (no staged Go files)"; exit 0; fi
        bad=$(echo "$staged" | xargs gofmt -l 2>/dev/null || true)
        if [ -n "$bad" ]; then
          echo "  ✗ gofmt would change:" >&2
          echo "$bad" | sed 's/^/    /' >&2
          echo "  fix with: gofmt -w <files>" >&2
          exit 1
        fi
        echo "  ✓ all staged files formatted"

  ci-fast:ai-lint:
    internal: true
    cmds:
      - 'echo "[3/5] ai-lint (staged Go files)"'
      - bash ./scripts/ai-lint.sh

  ci-fast:budget:
    internal: true
    cmds:
      - 'echo "[4/5] CLAUDE.md soft-cap budget"'
      - bash ./scripts/budget-status.sh | sed 's/^/  /'

  ci-fast:docs-regen:
    internal: true
    cmds:
      - 'echo "[5/5] docs regen (gated on action/config/docgen changes)"'
      - |
        staged=$(git diff --cached --name-only --diff-filter=ACMR \
          -- 'internal/actions/**/*.go' \
             'internal/config/*.go' \
             'internal/docgen/**/*.go' \
             'internal/schemagen/**/*.go' \
             'cmd/docs.go' 'cmd/schema.go' 2>/dev/null || true)
        if [ -z "$staged" ]; then
          echo "  (no action/config/docgen Go files staged — skipping)"
          exit 0
        fi
        if ! go build -o {{.BIN}} ./cmd >/dev/null 2>&1; then
          echo "  ✗ build failed — fix before committing." >&2
          exit 1
        fi
        if ! {{.BIN}} docs generate --section all --output docs-next/generated/actions.md >/dev/null 2>&1 || \
           ! {{.BIN}} docs generate --section schema --output docs-next/generated/schema.md >/dev/null 2>&1 || \
           ! {{.BIN}} docs generate --section action-properties --output docs-next/generated/properties.md >/dev/null 2>&1; then
          echo "  ✗ docs generate failed — fix the generator before committing." >&2
          exit 1
        fi
        if ! {{.BIN}} schema generate --format json --output internal/config/schema.json --strict >/dev/null 2>&1 || \
           ! {{.BIN}} schema generate --format typescript --output internal/config/schema.d >/dev/null 2>&1 || \
           ! {{.BIN}} schema generate --format typescript --output mooncake.d.ts >/dev/null 2>&1; then
          echo "  ✗ schema generate failed — fix the generator before committing." >&2
          exit 1
        fi
        changed=$(git diff --name-only -- \
          docs-next/generated/ \
          internal/config/schema.json \
          internal/config/schema.d \
          mooncake.d.ts)
        if [ -z "$changed" ]; then
          echo "  ✓ generated docs + schema already in sync"
          exit 0
        fi
        echo "$changed" | sed 's/^/  ↑ auto-staging: /'
        git add -- \
          docs-next/generated/ \
          internal/config/schema.json \
          internal/config/schema.d \
          mooncake.d.ts

  # ---------------------------------------------------------------------------
  # Full CI gate — pre-push. First failure stops the pipeline.
  # ---------------------------------------------------------------------------
  ci:
    desc: 'Full pre-push gate: build + test-race + lint + scan + docs/schema + arch + budget + dupl + escalation-lint'
    cmds:
      - task: ci:build
      - task: ci:test
      # - task: ci:test-race
      - task: ci:lint
      - task: ci:vuln
      - task: ci:regen-and-check
      - task: ci:arch
      - task: ci:budget
      - task: ci:dupl
      - task: ci:escalation
      - echo ""
      - echo "✓ All checks green — safe to commit."

  ci:build:
    internal: true
    cmds:
      - 'echo "[1/9] build"'
      - go build -o {{.BIN}} ./cmd

  ci:test:
    internal: true
    cmds:
      - 'echo "[2/9] test"'
      - go test {{.PKG}}

  ci:test-race:
    internal: true
    cmds:
      - 'echo "[2/9] test -race"'
      - go test -race {{.PKG}}

  ci:lint:
    internal: true
    cmds:
      # Cache leaks across sibling worktrees and surfaces phantom findings from
      # ../mooncake-*/ paths. Clean before each run so results reflect this tree.
      - 'echo "[3/9] golangci-lint (clean cache first)"'
      - golangci-lint cache clean
      - golangci-lint run {{.PKG}}

  ci:vuln:
    internal: true
    cmds:
      - 'echo "[4/9] govulncheck"'
      - govulncheck {{.PKG}}

  ci:regen-and-check:
    internal: true
    cmds:
      - 'echo "[5/9] regen docs + schema, then verify clean"'
      - '{{.BIN}} docs generate --section all --output docs-next/generated/actions.md >/dev/null'
      - '{{.BIN}} docs generate --section schema --output docs-next/generated/schema.md >/dev/null'
      - '{{.BIN}} docs generate --section action-properties --output docs-next/generated/properties.md >/dev/null'
      - '{{.BIN}} schema generate --format json --output internal/config/schema.json --strict >/dev/null'
      - '{{.BIN}} schema generate --format typescript --output internal/config/schema.d >/dev/null'
      - '{{.BIN}} schema generate --format typescript --output mooncake.d.ts >/dev/null'
      - task: docs-check
      - task: schema-check

  ci:arch:
    internal: true
    cmds:
      - 'echo "[6/9] arch-snapshot (regenerated; file is gitignored)"'
      - bash ./scripts/arch-snapshot.sh >/dev/null
      - |
        f=docs-working/ARCH_SNAPSHOT.md
        if [ ! -f "$f" ]; then echo "  (snapshot file missing — skipping summary)"; exit 0; fi
        echo "  Top packages by LOC:"
        awk '/^\| `/{print "    " $0}' "$f" | head -5
        god=$(awk '/^## God files/,/^## [^G]/' "$f" | grep -cE '^[[:space:]]*[0-9]+ ' || true)
        echo "  God files (>500 LOC, non-test): $god"
        echo "  Top cyclomatic hotspots:"
        awk '/^## Cyclomatic hotspots/,/^## [^C]/' "$f" | grep -E '^[[:space:]]*[0-9]+ ' | head -3 | sed 's/^/    /'

  ci:budget:
    internal: true
    cmds:
      - 'echo "[7/9] CLAUDE.md soft-cap budget"'
      - bash ./scripts/budget-status.sh | sed 's/^/  /'

  ci:dupl:
    internal: true
    silent: true
    cmds:
      - 'echo "[8/9] dupl (production-code duplication report)"'
      - |
        if ! command -v dupl >/dev/null 2>&1 && ! [ -x "$(go env GOPATH)/bin/dupl" ]; then
          echo "  dupl not installed — run 'task install-tools'. Skipping."
          exit 0
        fi
        dupl -threshold 100 -plumbing . 2>&1 | grep -v "_test.go" | python3 -c '
        import sys
        pairs = set()
        for line in sys.stdin:
            parts = line.strip().split(": duplicate of ")
            if len(parts) == 2:
                pairs.add(tuple(sorted(parts)))
        def n(rng):
            lo, hi = rng.split(":")[-1].split("-"); return int(hi) - int(lo) + 1
        ranked = sorted(pairs, key=lambda p: -n(p[0]))
        if not ranked:
            print("  no production duplication at threshold 100.")
        else:
            print(f"  {len(ranked)} production clone pair(s) at threshold 100 (informational):")
            for a, b in ranked:
                print(f"    {n(a):>3}L  {a}  <-->  {b}")
        '

  ci:escalation:
    internal: true
    cmds:
      - 'echo "[9/9] escalation-lint (spec-72 §G1, warning-only)"'
      - bash ./scripts/escalation-lint.sh
